<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="robots" content="noindex, nofollow">
<title>Console visio – DS Plomberie</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0e6ba8;--blue-light:#1a8fd1;--orange:#e87722;--ink:#06243a;--ink2:#0b3350;--line:rgba(255,255,255,.14)}
body{font-family:'Red Hat Display',sans-serif;background:var(--ink);color:#fff;min-height:100dvh;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.head h1{font-size:1.15rem;font-weight:900;letter-spacing:.01em}
.head .sub{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;border:2px solid var(--orange);padding:13px 26px;border-radius:4px;font:700 .92rem/1 'Red Hat Display',sans-serif;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:rgba(255,255,255,.85)}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:22px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);margin-bottom:6px}
.field input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:#fff;font:400 .95rem 'Red Hat Display',sans-serif}
.field input:focus{outline:none;border-color:var(--blue-light)}
.status-pill{display:inline-flex;align-items:center;gap:8px;font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25)}
.status-pill .dot{width:9px;height:9px;border-radius:50%;background:#4CE28C;box-shadow:0 0 0 0 rgba(76,226,140,.7);animation:pulse 1.8s infinite}
.status-pill.off .dot{background:#9aa8b8;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,226,140,.6)}70%{box-shadow:0 0 0 8px rgba(76,226,140,0)}100%{box-shadow:0 0 0 0 rgba(76,226,140,0)}}
.empty{text-align:center;padding:46px 20px;color:rgba(255,255,255,.5)}
.empty i{font-size:34px;color:rgba(255,255,255,.22);margin-bottom:14px;display:block}
.log{margin-top:26px}
.log h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);margin-bottom:10px}
.log-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;font-size:.86rem;background:rgba(0,0,0,.18)}
.log-item i{color:var(--orange)}
.log-item .when{margin-left:auto;font-size:.74rem;color:rgba(255,255,255,.45)}
.hidden{display:none !important}
.err{color:#FF9C9C;font-size:.85rem;margin-top:10px;min-height:20px}

/* ===== écran d'appel ===== */
.call-screen{position:fixed;inset:0;z-index:4000;background:radial-gradient(circle at 50% 22%,#1a8fd1 0%,#06243a 72%);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:56px 24px 64px}
.call-top{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.call-avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(155deg,rgba(232,119,34,.45),rgba(14,107,168,.55));border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 8px 30px rgba(0,0,0,.35);animation:call-pulse 2s ease-out infinite}
@keyframes call-pulse{0%{box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 0 0 rgba(255,255,255,.18)}70%{box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 0 18px rgba(255,255,255,0)}100%{box-shadow:0 8px 30px rgba(0,0,0,.35),0 0 0 0 rgba(255,255,255,0)}}
.call-name{font-size:1.2rem;font-weight:900;margin-top:14px}
.reglage-rec{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-bottom:16px;cursor:pointer}
.reglage-rec input{width:17px;height:17px;accent-color:var(--orange);cursor:pointer}
.reglage-rec span{font-size:.85rem}
.reglage-rec em{grid-column:2;font-style:normal;font-size:.75rem;color:rgba(255,255,255,.45);line-height:1.45}
.rec-badge{display:inline-flex;align-items:center;gap:7px;margin-top:9px;background:rgba(255,75,75,.16);border:1px solid rgba(255,107,107,.55);color:#ffc0c0;border-radius:999px;padding:4px 12px;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em}
.rec-badge .pt{width:8px;height:8px;border-radius:50%;background:#FF4B4B;animation:recpulse 1.6s infinite}
@keyframes recpulse{0%{box-shadow:0 0 0 0 rgba(255,75,75,.6)}70%{box-shadow:0 0 0 8px rgba(255,75,75,0)}100%{box-shadow:0 0 0 0 rgba(255,75,75,0)}}
.call-status{font-size:.72rem;opacity:.7;margin-top:5px;text-transform:uppercase;letter-spacing:.1em}
.call-actions{display:flex;align-items:flex-start;gap:24px;position:relative;z-index:2}
.call-action{display:flex;flex-direction:column;align-items:center;gap:9px}
.call-btn-label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.call-btn{width:58px;height:58px;border-radius:15px;border:1.5px solid rgba(232,119,34,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s ease;background:rgba(6,36,58,.55);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#f0a05a;font-size:20px;box-shadow:0 0 0 1px rgba(232,119,34,.12),0 0 18px rgba(232,119,34,.22)}
.call-btn:active{transform:scale(.9)}
.call-btn.mute-btn.active{color:#FF9C9C;border-color:rgba(255,107,107,.6)}
.call-btn.rec-on{color:#FF4B4B;border-color:rgba(255,107,107,.7);background:linear-gradient(155deg,rgba(255,107,107,.26),rgba(160,35,35,.35))}
.call-btn.hangup{width:66px;height:66px;color:#FF4B4B;border-color:rgba(255,107,107,.7);background:linear-gradient(155deg,rgba(255,107,107,.28),rgba(160,35,35,.4));box-shadow:0 0 0 1px rgba(255,107,107,.3),0 0 28px rgba(255,70,70,.5)}
.call-btn.accept{width:66px;height:66px;color:#4CE28C;border-color:rgba(79,216,146,.7);background:linear-gradient(155deg,rgba(79,216,146,.28),rgba(30,130,75,.4));box-shadow:0 0 0 1px rgba(79,216,146,.3),0 0 28px rgba(70,220,140,.5)}
.call-videos{position:absolute;inset:0}
.call-videos video{width:100%;height:100%;object-fit:cover;background:#06243a}
.call-videos .local-video{position:absolute;bottom:180px;right:14px;width:96px;height:132px;border-radius:14px;border:1.5px solid rgba(232,119,34,.65);object-fit:cover;z-index:1;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.call-videos.swapped #remote-video{position:absolute;bottom:180px;right:14px;width:96px;height:132px;border-radius:14px;border:1.5px solid rgba(232,119,34,.65);object-fit:cover;z-index:1}
.call-videos.swapped .local-video{position:absolute;inset:0;width:100%;height:100%;border-radius:0;border:none;z-index:0}
@media(min-width:760px){.call-videos{top:0;bottom:0;left:50%;transform:translateX(-50%);width:min(92vw,560px);background:#000}.call-videos #remote-video{object-fit:contain}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:4100;background:#06243a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:.85rem;max-width:88vw;text-align:center}

/* ===== ASSISTANT DIAGNOSTIC (console uniquement) ===== */
.assist{position:absolute;z-index:5;left:0;top:0;bottom:0;width:min(92vw,440px);background:rgba(4,20,33,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-right:1px solid var(--line);display:flex;flex-direction:column;text-align:left;transform:translateX(-102%);transition:transform .22s ease}
.assist.open{transform:translateX(0)}
.assist-head{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.55);flex:0 0 auto}
.assist-head .rec{width:9px;height:9px;border-radius:50%;background:#FF4B4B;animation:pulse 1.6s infinite}
.assist-head .rec.off{background:#9aa8b8;animation:none}
.assist-tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;flex:0 0 auto;border-bottom:1px solid var(--line)}
.assist-tabs button{flex:0 0 auto;background:rgba(0,0,0,.3);border:1px solid var(--line);color:rgba(255,255,255,.75);border-radius:999px;padding:5px 10px;font:600 .69rem 'Red Hat Display',sans-serif;cursor:pointer;white-space:nowrap}
.assist-tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.assist-body{flex:1 1 auto;overflow-y:auto;padding:14px 16px}
.fiche h3{font-size:.92rem;font-weight:900;margin-bottom:10px;color:#fff}
.fiche .blk{margin-bottom:12px}
.fiche .blk b{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin-bottom:4px}
.fiche .blk ul{margin:0;padding-left:16px}
.fiche .blk li{font-size:.79rem;color:rgba(255,255,255,.88);margin-bottom:3px}
.fiche .blk p{font-size:.79rem;color:rgba(255,255,255,.88)}
.fiche .flag{background:rgba(232,119,34,.14);border:1px solid rgba(232,119,34,.4);border-radius:6px;padding:8px 10px;font-size:.76rem;color:#ffd7ae}
.fiche .tarif{font-size:.76rem;color:#fff;background:rgba(255,255,255,.07);border-radius:6px;padding:8px 10px}
.assist-empty{font-size:.83rem;color:rgba(255,255,255,.45);padding:10px 0}
.assist-tr{flex:0 0 auto;max-height:22%;overflow-y:auto;border-top:1px solid var(--line);padding:12px 16px;font-size:.75rem;color:rgba(255,255,255,.7);line-height:1.5}
.assist-tr .interim{color:rgba(255,255,255,.4);font-style:italic}
@media(max-width:759px){
  .assist{left:0;right:0;top:auto;bottom:0;width:auto;height:74vh;border-right:none;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%)}
  .assist.open{transform:translateY(0)}
}

/* ===== ONGLETS CONSOLE + CATALOGUE + DIAGNOSTICS ===== */
.ctabs{display:flex;gap:8px;margin:20px 0 18px;border-bottom:1px solid var(--line)}
.ctabs button{background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.55);font:700 .85rem 'Red Hat Display',sans-serif;padding:10px 4px;margin-right:14px;cursor:pointer}
.ctabs button.on{color:#fff;border-bottom-color:var(--orange)}
.empty-txt{color:rgba(255,255,255,.45);font-size:.85rem;padding:14px 0}
.btn.small{padding:8px 14px;font-size:.78rem}
.cat-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cat-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(0,0,0,.18);flex-wrap:wrap}
.cat-main{flex:1 1 220px;min-width:0}
.cat-t{font-weight:700;font-size:.88rem}
.cat-kw{color:var(--orange);font-weight:900;font-size:.78rem;margin-left:4px}
.cat-v{font-size:.76rem;color:rgba(255,255,255,.5);margin-top:2px}
.cat-prix{flex:0 0 auto;display:flex;flex-direction:column;gap:4px}
.cat-prix label{font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4)}
.cat-achat{font-size:.82rem;color:rgba(255,255,255,.55)}
.cat-prix input{width:120px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:#fff;font:600 .85rem 'Red Hat Display',sans-serif}
.cat-prix input:focus{outline:none;border-color:var(--blue-light)}
.cat-prix input.ok{border-color:#4CE28C;box-shadow:0 0 0 2px rgba(76,226,140,.2)}
.cat-del{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.9rem;padding:6px}
.cat-del:hover{color:#FF6B6B}
.cat-new{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:14px;border:1px dashed var(--line);border-radius:8px;margin-top:14px}
.cat-new input{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:#fff;font:400 .85rem 'Red Hat Display',sans-serif}
.cat-new input:focus{outline:none;border-color:var(--blue-light)}
.cat-new .w-lg{flex:1 1 180px;min-width:140px}
.cat-new .w-sm{width:84px}
.diag{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden;background:rgba(0,0,0,.18)}
.diag-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.diag-head i{margin-left:auto;color:rgba(255,255,255,.35);transition:transform .18s}
.diag-head.open i{transform:rotate(180deg)}
.diag-when{font-weight:700;font-size:.84rem}
.diag-meta{font-size:.76rem;color:rgba(255,255,255,.5)}
.diag-edit{display:grid;gap:6px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.diag-edit label{font-size:.6rem;text-transform:uppercase;letter-spacing:.11em;color:rgba(255,255,255,.45)}
.diag-edit input,.diag-edit textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:7px;color:#fff;font:400 .85rem 'Red Hat Display',sans-serif;padding:8px 11px;line-height:1.5}
.diag-edit textarea{min-height:72px;resize:vertical}
.diag-edit input:focus,.diag-edit textarea:focus{outline:none;border-color:var(--orange)}
.diag-ttc{color:#4CE28C;font-weight:700;font-size:.82rem;margin-left:2px}
.diag-estim{border:1px solid var(--line);border-radius:9px;background:rgba(0,0,0,.2);padding:13px 15px;margin-bottom:13px}
.de-titre{font-size:.62rem;text-transform:uppercase;letter-spacing:.11em;color:var(--orange);margin-bottom:9px}
.de-tab{width:100%;border-collapse:collapse;font-size:.8rem}
.de-tab th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45);font-weight:600;padding:0 8px 6px 0;border-bottom:1px solid var(--line)}
.de-tab th:nth-child(2),.de-tab th:nth-child(4){text-align:center}
.de-tab th:nth-child(3),.de-tab th:nth-child(5){text-align:right}
.de-tab td{padding:6px 8px 6px 0;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top}
.de-tab td.c{text-align:center;white-space:nowrap}
.de-tab td.r{text-align:right;white-space:nowrap}
.de-u{color:rgba(255,255,255,.3);font-size:.68rem;margin-left:6px}
.de-tot{display:grid;gap:4px;margin-top:10px;font-size:.82rem}
.de-tot div{display:flex;justify-content:space-between}
.de-tot span{color:rgba(255,255,255,.5)}
.de-tot .ttc{font-size:.98rem;padding-top:6px;border-top:1px solid rgba(255,255,255,.12)}
.de-tot .ttc b{color:#4CE28C}
.diag-video{font-size:.76rem;color:rgba(255,255,255,.5)}
.diag-video i{color:var(--orange);margin-right:6px}
.diag-edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.diag-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;background:rgba(232,119,34,.18);border:1px solid rgba(232,119,34,.4);color:#ffc793;border-radius:999px;padding:3px 8px}
.diag-body{display:none;padding:0 14px 14px;border-top:1px solid var(--line)}
.diag-body.open{display:block}
.diag-body p{font-size:.85rem;color:rgba(255,255,255,.8);line-height:1.6;margin:12px 0}
.mod{border-top:1px solid rgba(255,255,255,.1);padding:9px 0}
.mod:first-of-type{border-top:none}
.mod-t{font-size:.84rem;font-weight:700;color:#fff}
.mod-kw{color:var(--orange);font-size:.74rem}
.mod-v{font-size:.74rem;color:rgba(255,255,255,.5);margin-top:1px}
.mod-p{font-size:.88rem;font-weight:900;color:#4CE28C;margin-top:4px;display:flex;align-items:baseline;gap:10px}
.mod-p .sur-devis{color:rgba(255,255,255,.5);font-weight:400;font-style:italic;font-size:.8rem}
.mod-c{font-size:.68rem;font-weight:400;color:rgba(255,255,255,.35)}

/* ===== marge % + suppression diagnostics ===== */
.cat-bulk{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;padding:14px;border:1px solid var(--line);border-radius:8px;margin-bottom:16px;background:rgba(0,0,0,.18)}
.cat-bulk .f{display:flex;flex-direction:column;gap:4px}
.cat-bulk label{font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4)}
.cat-bulk input{width:110px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:#fff;font:600 .85rem 'Red Hat Display',sans-serif}
.cat-bulk input:focus{outline:none;border-color:var(--blue-light)}
.cat-bulk .hint{font-size:.74rem;color:rgba(255,255,255,.45);flex:1 1 200px}
.cat-pct input{width:84px}
.cat-pct .suffix{position:absolute}
.diag-del{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:.85rem;padding:6px}
.diag-del:hover{color:#FF6B6B}
.diag-actions{display:flex;justify-content:flex-end;margin-bottom:12px}

/* ===== editeur de fiches ===== */
.fic{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:rgba(0,0,0,.18);overflow:hidden}
.fic-head{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer}
.fic-head i{margin-left:auto;color:rgba(255,255,255,.35);transition:transform .18s}
.fic-head.open i{transform:rotate(180deg)}
.fic-t{font-weight:700;font-size:.88rem}
.fic-n{font-size:.74rem;color:rgba(255,255,255,.45)}
.fic-body{display:none;padding:4px 14px 16px;border-top:1px solid var(--line)}
.fic-body.open{display:block}
.fic-g{margin-top:14px;display:flex;flex-direction:column;gap:5px}
.fic-g label{font-size:.62rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.42)}
.fic-g input,.fic-g textarea{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:#fff;font:400 .85rem 'Red Hat Display',sans-serif;line-height:1.5;resize:vertical}
.fic-g input:focus,.fic-g textarea:focus{outline:none;border-color:var(--blue-light)}
.fic-g input.ok,.fic-g textarea.ok{border-color:#4CE28C;box-shadow:0 0 0 2px rgba(76,226,140,.18)}
.fic-row{flex-direction:row;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:.8rem;color:rgba(255,255,255,.8);text-transform:none;letter-spacing:0}
.chk input{width:auto}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.tg{display:inline-flex;align-items:center;gap:6px;background:rgba(232,119,34,.16);border:1px solid rgba(232,119,34,.42);color:#ffc793;border-radius:999px;padding:4px 6px 4px 11px;font-size:.76rem}
.tg button{background:none;border:none;color:#ffc793;cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
.tg button:hover{color:#fff}
.fic-del{color:#FF9C9C !important;border-color:rgba(255,107,107,.4) !important}
.tarifs-box{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;padding:14px;border:1px solid var(--line);border-radius:8px;background:rgba(0,0,0,.18);margin-bottom:16px}
.tarifs-box .f{display:flex;flex-direction:column;gap:4px}
.tarifs-box label{font-size:.6rem;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.4)}
.tarifs-box input{width:120px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:#fff;font:600 .85rem 'Red Hat Display',sans-serif}
.tarifs-box input:focus{outline:none;border-color:var(--blue-light)}
.fic-etat{font-size:.78rem;color:rgba(255,255,255,.5);margin-bottom:12px}

/* ===== tarifs ===== */
.pxfam{margin-bottom:22px}
.pxfam h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.11em;color:var(--orange);margin-bottom:8px}
.pxfam h3 span{color:rgba(255,255,255,.35);margin-left:6px}

/* ---------- enregistrement video de l'appel ---------- */
let recorder = null, recMorceaux = [], recAudioCtx = null, nomFichierVideo = '';
let recAuto = localStorage.getItem('ds-rec-auto') !== '0';   // automatique par defaut
function majBoutonRec(){
  const b = document.getElementById('btn-rec');
  if(!b) return;
  const actif = !!(recorder && recorder.state === 'recording');
  b.classList.toggle('rec-on', actif);
  b.innerHTML = actif ? '<i class="fas fa-stop"></i>' : '<i class="fas fa-circle"></i>';
  const l = b.closest('.call-action');
  const t = l && l.querySelector('.call-btn-label');
  if(t) t.textContent = actif ? 'Arrêter' : 'Enregistrer';
}
function nomVideo(appelant){
  const d = new Date(), p2 = (n) => String(n).padStart(2, '0');
  const qui = (appelant || 'visiteur').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'visiteur';
  return `DS-appel_${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}_${p2(d.getHours())}h${p2(d.getMinutes())}_${qui}.webm`;
}
function demarrerEnregistrement(appelant){
  if(recorder || !remoteStream) return;
  if(typeof MediaRecorder === 'undefined'){ toast("Ce navigateur n'enregistre pas la vidéo."); return; }
  try{
    // image du client + les deux voix melangees
    const pistes = [];
    const v = remoteStream.getVideoTracks()[0];
    if(v) pistes.push(v);
    recAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const melange = recAudioCtx.createMediaStreamDestination();
    [remoteStream, localStream].forEach(st => {
      if(st && st.getAudioTracks().length){
        try{ recAudioCtx.createMediaStreamSource(st).connect(melange); }catch(e){}
      }
    });
    melange.stream.getAudioTracks().forEach(t => pistes.push(t));
    if(!pistes.length) return;

    const types = ['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
    const type = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
    recMorceaux = [];
    nomFichierVideo = nomVideo(appelant);
    recorder = new MediaRecorder(new MediaStream(pistes), type ? { mimeType: type } : undefined);
    recorder.ondataavailable = (e) => { if(e.data && e.data.size) recMorceaux.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recMorceaux, { type: recorder.mimeType || 'video/webm' });
      recMorceaux = [];
      if(blob.size > 0){
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = nomFichierVideo;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
        toast("Vidéo enregistrée : " + nomFichierVideo);
      }
      recorder = null;
      if(recAudioCtx){ try{ recAudioCtx.close(); }catch(e){} recAudioCtx = null; }
      majBoutonRec();
    };
    recorder.start(1000);
    const b = document.getElementById('rec-video'); if(b) b.classList.remove('hidden');
    majBoutonRec();
  }catch(e){
    recorder = null;
    toast("Enregistrement vidéo impossible : " + (e.message || e));
  }
}
function basculerEnregistrement(){
  if(recorder && recorder.state === 'recording'){
    arreterEnregistrement();
    toast("Enregistrement arrêté, la vidéo part dans tes téléchargements.");
  }else if(remoteStream){
    demarrerEnregistrement(assistCallerName);
  }else{
    toast("La vidéo du client n'est pas encore arrivée.");
  }
}
function arreterEnregistrement(){
  const b = document.getElementById('rec-video'); if(b) b.classList.add('hidden');
  if(recorder && recorder.state !== 'inactive'){ try{ recorder.stop(); }catch(e){ recorder = null; } }
}
let ringAudioCtx = null, ringInterval = null, missedTimeout = null;
let localAudioMuted = false, currentFacingMode = 'user';

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 5000);
}

/* ---------- sonnerie ---------- */
function startRingtone(){
  stopRingtone();
  try { ringAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  if(ringAudioCtx.state === 'suspended') ringAudioCtx.resume().catch(()=>{});
  function beep(){
    if(!ringAudioCtx) return;
    if(ringAudioCtx.state === 'suspended') ringAudioCtx.resume().catch(()=>{});
    const now = ringAudioCtx.currentTime;
    [0, 0.22].forEach(d => {
      const osc = ringAudioCtx.createOscillator(), gain = ringAudioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 950;
      gain.gain.setValueAtTime(0.0001, now + d);
      gain.gain.exponentialRampToValueAtTime(0.9, now + d + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + d + 0.2);
      osc.connect(gain).connect(ringAudioCtx.destination);
      osc.start(now + d); osc.stop(now + d + 0.22);
    });
  }
  beep(); ringInterval = setInterval(beep, 1200);
}
function stopRingtone(){
  if(ringInterval){ clearInterval(ringInterval); ringInterval = null; }
  if(ringAudioCtx){ ringAudioCtx.close().catch(()=>{}); ringAudioCtx = null; }
}

async function setOnline(state){

  $('btn-toggle').textContent = state ? 'Se mettre hors ligne' : 'Se remettre en ligne';

    await setDoc(doc(db, "presence", DESK_ID), {
      online: state, updatedAt: Date.now(), at: serverTimestamp()
    }, { merge: true });
  }catch(e){
    // Echec d'ecriture = la console n'est PAS reellement en ligne : on le montre.
    $('pill').classList.add('off');
    $('pill-txt').textContent = 'Hors ligne';
    $('waiting').classList.add('hidden');
    toast("Presence non enregistree : " + (e.code || e.message));
    if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }

  }
  if(heartbeatTimer){ clearInterval(heartbeatTimer); heartbeatTimer = null; }

    heartbeatTimer = setInterval(() => {

          $('pill').classList.add('off');

/* ---------- appels entrants ---------- */
function listenIncoming(){
  if(incomingUnsub) return;
  const q = query(collection(db, "calls"), where("target", "==", DESK_ID), where("status", "==", "ringing"));
  incomingUnsub = onSnapshot(q, (snap) => {
    snap.docChanges().forEach(ch => {
      if(ch.type !== 'added') return;
      const d = ch.doc.data();
      if(handledCalls.has(ch.doc.id)) return;
      if(d.createdAtMs && Date.now() - d.createdAtMs > RING_DURATION) return; // appel périmé
      handledCalls.add(ch.doc.id);
      handleIncoming(ch.doc.id, d);
    });
  });
}

function handleIncoming(callId, data){
  if(!online){ updateDoc(doc(db, "calls", callId), { status:"rejected" }).catch(()=>{}); return; }

  let handled = false;

  $('btn-accept').addEventListener('click', async () => {

        </div>

/* ---------- WebRTC (côté appelé) ---------- */
async function connectCall(callId){
  try{
    localStream = await navigator.mediaDevices.getUserMedia({ audio:true, video:true });
  }catch(e){ toast("Impossible d'accéder à la caméra/micro."); endCall(); return; }
  $('local-video').srcObject = localStream;
  setupControls();

  peerConnection = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

  peerConnection.ontrack = (ev) => {
    const rv = $('remote-video');
    if(rv && rv.srcObject !== ev.streams[0]){
      rv.srcObject = ev.streams[0]; remoteStream = ev.streams[0]; rv.play().catch(()=>{});
      if(recAuto) demarrerEnregistrement(assistCallerName);
      majBoutonRec();
    }
    const st = $('call-status'); if(st) st.textContent = "En communication";
  };

  const connectTimeout = setTimeout(() => {
    if(peerConnection){ toast("Connexion impossible : réseau incompatible."); endCall(); }
  }, 35000);
  peerConnection.onconnectionstatechange = () => {
    if(!peerConnection) return;
    if(peerConnection.connectionState === 'connected') clearTimeout(connectTimeout);
    if(['failed','disconnected','closed'].includes(peerConnection.connectionState)){ clearTimeout(connectTimeout); endCall(); }
  };

  const callDocRef = doc(db, "calls", callId);
  const callerCandidates = collection(callDocRef, "callerCandidates");
  const calleeCandidates = collection(callDocRef, "calleeCandidates");

  webrtcUnsubs.push(onSnapshot(callDocRef, (snap) => {
    const d = snap.data();
    if(d && (d.status === 'ended' || d.status === 'rejected')) endCall(true, false);
  }));

  peerConnection.onicecandidate = (ev) => { if(ev.candidate) addDoc(calleeCandidates, ev.candidate.toJSON()); };

  let unsubOffer = null;
  const offerData = await Promise.race([
    new Promise((resolve) => {
      unsubOffer = onSnapshot(callDocRef, (snap) => {
        const d = snap.data(); if(d && d.offer) resolve(d.offer);
      });
    }),
    new Promise((resolve) => setTimeout(() => resolve(null), 20000))
  ]);
  if(unsubOffer) unsubOffer();
  if(!offerData){ clearTimeout(connectTimeout); toast("L'appelant n'a pas pu établir l'appel."); endCall(); return; }
  if(!peerConnection) return;

  await peerConnection.setRemoteDescription(new RTCSessionDescription(offerData));
  const answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  await updateDoc(callDocRef, { answer: { sdp: answer.sdp, type: answer.type } });

  webrtcUnsubs.push(onSnapshot(callerCandidates, (snap) => {
    snap.docChanges().forEach(c => {
      if(c.type === 'added' && peerConnection) peerConnection.addIceCandidate(new RTCIceCandidate(c.doc.data())).catch(()=>{});
    });
  }));
}

function setupControls(){
  const muteBtn = $('btn-mute');
  if(muteBtn) muteBtn.addEventListener('click', () => {
    if(!localStream) return;
    localAudioMuted = !localAudioMuted;
    localStream.getAudioTracks().forEach(t => t.enabled = !localAudioMuted);
    muteBtn.classList.toggle('active', localAudioMuted);
    muteBtn.innerHTML = localAudioMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
  });
  const switchBtn = $('btn-camera-switch'), videosBox = $('call-videos'), localVideo = $('local-video');
  if(switchBtn){
    let switching = false;
    switchBtn.addEventListener('click', async () => {
      if(!localStream || switching) return;
      switching = true;
      const next = currentFacingMode === 'user' ? 'environment' : 'user';
      const oldTrack = localStream.getVideoTracks()[0], audioTrack = localStream.getAudioTracks()[0];
      try{
        if(oldTrack) oldTrack.stop();
        const cam = await navigator.mediaDevices.getUserMedia({ audio:false, video:{ facingMode: next } });
        const newTrack = cam.getVideoTracks()[0];
        if(peerConnection){
          const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
          if(sender) await sender.replaceTrack(newTrack);
        }
        const ns = new MediaStream();
        if(audioTrack) ns.addTrack(audioTrack);
        ns.addTrack(newTrack);
        localStream = ns; currentFacingMode = next;
        if(localVideo) localVideo.srcObject = localStream;
      }catch(e){ toast("Changement de caméra impossible."); }
      switching = false;
    });
  }
  if(localVideo && videosBox && !videosBox.dataset.bound){
    videosBox.dataset.bound = '1';
    localVideo.addEventListener('click', () => videosBox.classList.toggle('swapped'));
  }
}

function endCall(clearRoot = true, updateStatus = true){
  arreterEnregistrement();
  stopAssistant();
  clearTimeout(missedTimeout); stopRingtone();
  if(peerConnection){ try{ peerConnection.close(); }catch(e){} peerConnection = null; }
  if(localStream){ localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if(remoteStream){ remoteStream.getTracks().forEach(t => t.stop()); remoteStream = null; }
  webrtcUnsubs.forEach(u => { try{ u(); }catch(e){} }); webrtcUnsubs = [];
  if(currentCallDocId && updateStatus) updateDoc(doc(db, "calls", currentCallDocId), { status:"ended" }).catch(()=>{});
  currentCallDocId = null; localAudioMuted = false;
  if(clearRoot) ecranRecap();
}

}

/* ---------- dedoublonnage generique ---------- */
async function dedoublonner(nomCollection, liste, cle, label){
  const groupes = new Map();
  liste.forEach(x => {
    const k = cle(x);
    if(!k) return;
    if(!groupes.has(k)) groupes.set(k, []);
    groupes.get(k).push(x);
  });
  const aSupprimer = [];
  groupes.forEach(g => {
    if(g.length < 2) return;
    // on garde le plus ancien (createdAt le plus petit), on supprime les autres
    // on garde la plus recente ; a date egale, celle qui a le plus de mots-cles
    const tries = g.slice().sort((a,b) => {
      const ta = a.createdAt && a.createdAt.seconds ? a.createdAt.seconds : 0;
      const tb = b.createdAt && b.createdAt.seconds ? b.createdAt.seconds : 0;
      if(ta !== tb) return tb - ta;
      return ((b.mots||[]).length) - ((a.mots||[]).length);
    });
    aSupprimer.push(...tries.slice(1));
  });
  if(!aSupprimer.length){ toast("Aucun doublon trouvé."); return; }
  if(!confirm(`${aSupprimer.length} doublon(s) détecté(s) sur ${label}. Les supprimer ? La version la plus récente de chaque est conservée.`)) return;
  let ko = 0;
  for(const x of aSupprimer){
    try{ await deleteDoc(doc(db, nomCollection, x.docId || x.id)); } catch(e){ ko++; }
  }
  toast(ko ? `${aSupprimer.length - ko} supprimé(s), ${ko} en échec.` : `${aSupprimer.length} doublon(s) supprimé(s).`);
}

const COEFS_DEFAUT = { petit: 2.2, courant: 1.7, moyen: 1.4, gros: 1.18 };
let coefs = { ...COEFS_DEFAUT };

function coefPour(achatHT){
  if(achatHT == null || isNaN(achatHT)) return null;
  if(achatHT < 50) return coefs.petit;
  if(achatHT < 300) return coefs.courant;
  if(achatHT < 800) return coefs.moyen;
  return coefs.gros;
}

let prix = [], prixUnsub = null;

function ecouterPrix(){
  if(prixUnsub) return;
  prixUnsub = onSnapshot(collection(db, "prix"), (snap) => {
    prix = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderPrix();
    renderAssist();
  }, () => {});
}

function prixFamille(fam){
  return prix.filter(p => p.famille === fam && p.actif !== false)
             .sort((a,b) => (a.prixHT||0) - (b.prixHT||0));
}

function blocPrixFamille(fam){
  const l = prixFamille(fam);
  if(!l.length) return '';
  const nom = (FAMILLES.find(f => f.id === fam) || {}).nom || fam;
  const rows = l.map(p => `<div class="pxr">
      <span class="pxr-d">${p.designation}</span>
      <span class="pxr-p">${eur(p.prixHT)} HT<span class="pxr-u">/${p.unite}</span></span>
    </div>`).join('');
  return `<div class="blk"><b>Tes prix — ${nom}</b><div class="pxl">${rows}</div></div>`;
}

function renderPrix(){
  const box = document.getElementById('px-list');
  if(!box) return;
  const c = document.getElementById('px-count');
  if(c) c.textContent = prix.length ? `${prix.length} référence(s)` : '';
  if(!prix.length){
    box.innerHTML = `<p class="empty-txt">Aucun tarif. Clique sur « Importer mes 65 prix relevés » pour partir de tes devis existants.</p>`;
    return;
  }
  box.innerHTML = FAMILLES.map(f => {
    const l = prixFamille(f.id);
    if(!l.length) return '';
    return `<div class="pxfam"><h3>${f.nom} <span>${l.length}</span></h3>` + l.map(p => `
      <div class="pxrow" data-p="${p.id}">
        <div class="pxrow-m">
          <div class="pxrow-d">${p.designation}</div>
          <div class="pxrow-s">${p.unite} · TVA ${p.tva} %${p.source ? ' · ' + p.source : ''}</div>

function tarifTexte(){
  const f = (n) => Number(n).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2});
  return `Déplacement ${f(tarifs.deplacement)} € TTC · 1ʳᵉ heure ${f(tarifs.premiereHeure)} € TTC · heure suivante ${f(tarifs.heureSuivante)} € TTC`;
}

// affichage : une seule fiche par identifiant, mots-cles dedoublonnes
function uniquesFiches(liste){
  const vus = new Set(), out = [];
  liste.forEach(f => {
    const k = (f.id || f.titre || '').toLowerCase();
    if(!k || vus.has(k)) return;
    vus.add(k);
    const m = [], vm = new Set();
    (f.mots || []).forEach(x => { const s = strip(x); if(s && !vm.has(s)){ vm.add(s); m.push(x); } });
    out.push({ ...f, mots: m });
  });
  return out;
}

function ecouterFiches(){
  if(fichesUnsub) return;

      .sort((a,b) => (a.ordre||0) - (b.ordre||0));
    // tant que la collection est vide, on garde les fiches d'origine
    fichesBrutes = docs;
    fiches = uniquesFiches(docs.length ? docs.map(d => ({ ...d, id: d.docId })) : FICHES_DEFAUT.slice());

async function importerFiches(){
  const btn = document.getElementById('btn-fic-import');
  if(btn){ btn.disabled = true; btn.textContent = 'Import…'; }
  try{
    // on compare sur les documents bruts : leur champ "id" est l'identifiant metier
    // (dans `fiches`, id a ete remplace par l'identifiant Firestore)
    const parId = new Map(), parTitre = new Map();
    (fichesBrutes || []).forEach(x => {
      if(x.id) parId.set(x.id, x);
      if(x.titre) parTitre.set(strip(x.titre), x);
    });
    let i = 0, ajoutes = 0, completes = 0, ignores = 0;
    for(const f of FICHES_DEFAUT){
      i++;
      const dejaLa = parId.get(f.id) || parTitre.get(strip(f.titre));
      if(dejaLa){
        // fiche deja en base : on complete seulement les mots-cles manquants
        const actuels = (dejaLa.mots || []).map(m => strip(m));
        const manquants = (f.mots || []).filter(m => !actuels.includes(strip(m)));
        if(manquants.length){
          await updateDoc(doc(db, "fiches", dejaLa.docId), { mots: [...(dejaLa.mots || []), ...manquants] });
          completes++;
        }else ignores++;
        continue;
      }
      ajoutes++;
      await addDoc(collection(db, "fiches"), {
        id: f.id, court: f.court, titre: f.titre, mots: f.mots, famille: f.famille || '',
        montrer: f.montrer, questions: f.questions, causes: f.causes,
        flag: f.flag || '', annonce: f.annonce, lien: f.lien || '',
        catalogue: !!f.catalogue, ordre: i, createdAt: serverTimestamp()
      });
    }
    toast(`${ajoutes} fiche(s) ajoutée(s), ${completes} complétée(s) en mots-clés, ${ignores} déjà à jour.`);

/* ---------- utilitaires ---------- */
const strip = (t) => (t||'').toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9\s]/g, ' ').replace(/\s+/g, ' ').trim();

const eur = (n) => (n === null || n === undefined || n === '' || isNaN(n))
  ? null : Number(n).toLocaleString('fr-FR', {minimumFractionDigits:2, maximumFractionDigits:2}) + ' €';

const CHIFFRES = {'dix':10,'douze':12,'quatorze':14,'quinze':15,'seize':16,'dix-huit':18,'dix huit':18,'vingt':20,'vingt-trois':23,'vingt trois':23,'vingt-cinq':25,'vingt cinq':25,'vingt-huit':28,'vingt huit':28,'trente':30,'trente-deux':32,'trente deux':32,'trente-cinq':35,'trente cinq':35,'quarante':40,'quarante-cinq':45,'quarante cinq':45};

function detecterKw(txt){
  const t = strip(txt);
  let m = t.match(/(\d{1,3})\s*(kw|kilowatt|kilo watt|kilowatts)/);
  if(m) return parseInt(m[1], 10);
  for(const mot in CHIFFRES){
    if(new RegExp(mot.replace(/-/g,'[ -]') + '\\s*(kw|kilowatt)').test(t)) return CHIFFRES[mot];
  }
  return null;
}

/* ---------- catalogue ---------- */
let catalogue = [], catalogueUnsub = null;

function ecouterCatalogue(){
  if(catalogueUnsub) return;
  catalogueUnsub = onSnapshot(collection(db, "catalogue"), (snap) => {
    catalogue = snap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a,b) => (a.gamme||'').localeCompare(b.gamme||'') || (a.kwMin||0) - (b.kwMin||0));
    renderCatalogue();
    renderAssist();
  }, () => {});
}

function modelesPourKw(kw){
  if(kw === null) return [];
  return catalogue.filter(m => m.actif !== false && (m.kwMin||0) <= kw && kw <= (m.kwMax||0));
}

function fenetre(){
  const mots = (transcriptFinal + ' ' + transcriptInterim).trim().split(/\s+/);
  return mots.slice(-FENETRE_MOTS).join(' ');
}

function scoreFiches(txt){
  const t = strip(txt);
  return fiches.map(f => {
    const vus = new Set();
    let n = 0, dernier = -1;
    (f.mots || []).forEach(m => {
      const k = strip(m);
      if(!k || vus.has(k)) return;
      vus.add(k);
      const p = t.lastIndexOf(k);        // position du DERNIER emploi du mot-cle
      if(p >= 0){ n++; if(p > dernier) dernier = p; }
    });
    return { f, n, dernier };
  }).filter(x => x.n > 0)
    // la fiche dont un mot-cle vient d'etre prononce passe devant ;
    // le nombre de correspondances ne sert qu'a departager
    .sort((a, b) => (b.dernier - a.dernier) || (b.n - a.n));
}

function blocCatalogue(){
  const kw = kwDetecte;
  if(kw === null){
    return `<div class="blk"><b>Modèles</b><p class="assist-empty">Dis une puissance (« 25 kW ») pour voir les modèles correspondants.</p></div>`;
  }
  const mods = modelesPourKw(kw);
  if(!mods.length){
    return `<div class="blk"><b>Modèles ${kw} kW</b><p class="assist-empty">Aucun modèle à ${kw} kW dans le catalogue.</p></div>`;
  }
  const rows = mods.map(m => {
    const pv = eur(m.prixVenteTTC);
    const pc = eur(m.prixCedeoTTC);
    return `<div class="mod">
      <div class="mod-t">${m.gamme || ''} <span class="mod-kw">${m.kwMin === m.kwMax ? m.kwMin : m.kwMin + '-' + m.kwMax} kW</span></div>
      <div class="mod-v">${m.variante || ''}</div>
      <div class="mod-p">${pv ? pv + ' TTC' : '<span class="sur-devis">sur devis</span>'}${pc ? `<span class="mod-c">achat ${pc}</span>` : ''}</div>
    </div>`;
  }).join('');
  return `<div class="blk"><b>Modèles ${kw} kW — ${mods.length} référence${mods.length>1?'s':''}</b>${rows}</div>`;
}

function ficheHtml(f){
  const li = (arr) => arr.map(x => `<li>${x}</li>`).join('');
  return `

}

/* ===== sujets cumulés + devis en préparation ===== */
const TVA_DEFAUT = 10;
let sujets = [];        // ids des fiches reconnues pendant l'appel, dans l'ordre
let devis  = [];        // lignes du devis

function devisInit(){
  devis = [
    { des: 'Déplacement', unite: 'U', pu: tarifs.deplacement, tva: TVA_DEFAUT, qte: 1, fixe: true },
    { des: "1ʳᵉ heure de main-d'œuvre", unite: 'h', pu: tarifs.heureSuivante, tva: TVA_DEFAUT, qte: 1, fixe: true }
  ];
}

let sujetsEcartes = new Set();   // sujets retires a la main : on ne les remet pas
function ajouterSujet(id){
  if(!id || sujets.includes(id) || sujetsEcartes.has(id)) return;
  sujets.push(id);
  ficheManuelle = null;   // un nouveau sujet reprend la main : la fiche suit la conversation
  ligneDevisDuSujet(id);
  renderSujets();
}
function retirerSujet(id){
  sujets = sujets.filter(x => x !== id);
  sujetsEcartes.add(id);
  const f = fiches.find(x => x.id === id);
  if(f) devis = devis.filter(l => l.sujet !== id);
  if(ficheManuelle && ficheManuelle.id === id) ficheManuelle = null;
  renderSujets(); renderAssist(); renderDevis();
}
// chaque sujet reconnu pose sa ligne dans le devis : la prestation chiffree
// de sa famille si elle existe, sinon une ligne a chiffrer
function ligneDevisDuSujet(id){
  const f = fiches.find(x => x.id === id);
  if(!f || devis.some(l => l.sujet === id)) return;
  const liste = prixFamille(f.famille);
  if(liste.length){
    const p = liste[0];
    if(devis.some(l => l.des === p.designation)) return;
    devis.push({ des: p.designation, unite: p.unite || 'U', pu: Number(p.prixHT) || 0,
                 tva: p.tva == null ? TVA_DEFAUT : p.tva, qte: 1, sujet: id });
  }else{
    devis.push({ des: f.court + ' \u2014 \u00e0 chiffrer', unite: 'U', pu: 0,
                 tva: TVA_DEFAUT, qte: 1, sujet: id, aChiffrer: true });
  }
  renderDevis();
}

function devisAjouter(designation, unite, pu, tva){
  const i = devis.findIndex(l => l.des === designation);
  if(i >= 0) devis[i].qte++;
  else devis.push({ des: designation, unite: unite || 'U', pu: Number(pu) || 0, tva: tva == null ? TVA_DEFAUT : tva, qte: 1 });
  renderDevis();
}

function devisTotaux(){
  let ht = 0, tva = 0;
  devis.forEach(l => { const m = l.pu * l.qte; ht += m; tva += m * (l.tva / 100); });
  return { ht, tva, ttc: ht + tva };
}

function devisSuggestions(){
  const familles = [...new Set(sujets.map(id => {
    const f = fiches.find(x => x.id === id);
    return f && f.famille;
  }).filter(Boolean))];
  const dedans = new Set(devis.map(l => l.des));
  const out = [];
  familles.forEach(fam => prixFamille(fam).forEach(p => {
    if(!dedans.has(p.designation)) out.push(p);
  }));
  return out;
}

function renderSujets(){
  const box = document.getElementById('sujets');
  if(!box) return;
  if(!sujets.length){
    box.innerHTML = '<span class="sujets-vide">Aucun sujet détecté pour l\'instant</span>';
    return;
  }
  box.innerHTML = sujets.map(id => {
    const f = fiches.find(x => x.id === id);
    const nom = f ? f.court : id;
    const on = (ficheManuelle && ficheManuelle.id === id) ? ' on' : '';
    return `<span class="suj${on}" data-suj="${id}">${nom}<button data-rmsuj="${id}" title="Retirer">&times;</button></span>`;
  }).join('');
  box.querySelectorAll('[data-suj]').forEach(e => e.addEventListener('click', (ev) => {
    if(ev.target.dataset.rmsuj) return;
    const choisie = fiches.find(f => f.id === e.dataset.suj) || null;
    ficheManuelle = (ficheManuelle && choisie && ficheManuelle.id === choisie.id) ? null : choisie;
    renderAssist(); renderSujets();
  }));
  box.querySelectorAll('[data-rmsuj]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation(); retirerSujet(b.dataset.rmsuj);
  }));
}

function renderDevis(){
  const box = document.getElementById('devis-lignes');
  if(!box) return;
  box.innerHTML = devis.map((l, i) => `
    <div class="dl">
      <div class="dl-d">${l.des}<span class="dl-u">${l.unite}</span></div>
      <div class="dl-bas">
        <div class="dl-q">
          <button data-moins="${i}">−</button><span>${l.qte}</span><button data-plus="${i}">+</button>
        </div>
        <input class="dl-pu${l.aChiffrer && !l.pu ? ' vide' : ''}" type="number" step="0.01" min="0" inputmode="decimal" value="${l.pu}" data-pu="${i}" title="Prix unitaire HT">
        <select class="dl-tva" data-tva="${i}">
          <option value="10"${l.tva === 10 ? ' selected' : ''}>10 %</option>
          <option value="20"${l.tva === 20 ? ' selected' : ''}>20 %</option>
          <option value="0"${l.tva === 0 ? ' selected' : ''}>0 %</option>
        </select>
        <div class="dl-m">${eur(l.pu * l.qte)}</div>
        <button class="dl-x" data-rm="${i}" title="Retirer"><i class="fas fa-xmark"></i></button>
      </div>
    </div>`).join('');

  box.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => { devis[+b.dataset.plus].qte++; renderDevis(); }));
  box.querySelectorAll('[data-moins]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.moins;
    if(devis[i].qte > 1) devis[i].qte--; else devis.splice(i, 1);
    renderDevis();
  }));
  box.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { devis.splice(+b.dataset.rm, 1); renderDevis(); }));
  box.querySelectorAll('[data-tva]').forEach(s => s.addEventListener('change', () => { devis[+s.dataset.tva].tva = parseInt(s.value, 10); renderDevis(); }));
  box.querySelectorAll('[data-pu]').forEach(inp => inp.addEventListener('change', () => {
    const l = devis[+inp.dataset.pu];
    l.pu = Math.max(0, Number(inp.value) || 0);
    if(l.pu > 0){ l.aChiffrer = false; l.des = l.des.replace(' \u2014 \u00e0 chiffrer', ''); }
    renderDevis();
  }));

  const t = devisTotaux();
  const tot = document.getElementById('devis-total');
  if(tot) tot.innerHTML =
    `<div><span>Total HT</span><b>${eur(t.ht)}</b></div>` +
    `<div><span>TVA</span><b>${eur(t.tva)}</b></div>` +
    `<div class="ttc"><span>Total TTC</span><b>${eur(t.ttc)}</b></div>`;

  const sug = document.getElementById('devis-sugg');
  if(sug){
    const l = devisSuggestions();
    sug.innerHTML = l.length
      ? l.map(p => `<button class="sg" data-add='${encodeURIComponent(JSON.stringify({d:p.designation,u:p.unite,p:p.prixHT,t:p.tva}))}'>
           <i class="fas fa-plus"></i> ${p.designation} <em>${eur(p.prixHT)}</em></button>`).join('')
      : '<span class="sujets-vide">Les prestations proposées apparaîtront ici selon les sujets détectés.</span>';
    sug.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
      const o = JSON.parse(decodeURIComponent(b.dataset.add));
      devisAjouter(o.d, o.u, o.p, o.t);
    }));
  }
}

function renderAssist(){
  const body = document.getElementById('assist-body');
  const tabs = document.getElementById('assist-tabs');
  if(!body || !tabs) return;

  const ranked = scoreFiches(fenetre());
  const auto = ranked.length ? ranked[0].f : null;
  // tous les sujets entendus s'ajoutent, du plus ancien au plus recent
  [...ranked].reverse().forEach(r => { fichesVues.add(r.f.id); ajouterSujet(r.f.id); });
  const active = ficheManuelle || auto;

  const chips = [`<button class="${ficheManuelle ? '' : 'on'}" data-fiche="__auto">Auto</button>`]
    .concat(fiches.map(f => {
      const on = (ficheManuelle && f.id === ficheManuelle.id) ? ' on' : '';
      const hit = ranked.find(r => r.f.id === f.id);
      return `<button class="${on.trim()}" data-fiche="${f.id}">${hit ? '• ' : ''}${f.court}</button>`;
    }));
  tabs.innerHTML = chips.join('');
  tabs.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      ficheManuelle = b.dataset.fiche === '__auto' ? null : fiches.find(f => f.id === b.dataset.fiche);
      renderAssist();
      const a = document.getElementById('assist'); if(a) a.classList.add('open');
    });
  });

  body.innerHTML = active
    ? ficheHtml(active)
    : `<p class="assist-empty">Aucun cas détecté. Parle, ou choisis une fiche ci-dessus.</p>`;
}

function renderTranscript(){
  const tr = document.getElementById('assist-tr');
  if(!tr) return;
  tr.innerHTML = (transcriptFinal || '') + (transcriptInterim ? `<span class="interim"> ${transcriptInterim}</span>` : '');
  tr.scrollTop = tr.scrollHeight;
}

/* ---------- transcription ---------- */
function startAssistant(callId, data){
  assistCallId = callId;
  assistCallerName = (data && data.callerName) || 'Visiteur';
  assistStartedAt = Date.now();
  transcriptFinal = ''; transcriptInterim = ''; fichesVues = new Set();
  ficheManuelle = null; kwDetecte = null;
  sujets = []; sujetsEcartes = new Set(); devisInit(); dernierDiagId = null;

  const panel = document.getElementById('assist');
  const pdev  = document.getElementById('devis-panneau');
  const ecran = callRoot.querySelector('.call-screen');
  const majEcran = () => {
    if(!ecran) return;
    ecran.classList.toggle('p-gauche', !!(panel && panel.classList.contains('open')));
    ecran.classList.toggle('p-droite', !!(pdev && pdev.classList.contains('open')));
  };
  // sur grand ecran les deux panneaux sont ouverts d'emblee, la video reste entre les deux
  if(window.innerWidth >= 1180 && panel) panel.classList.add('open');
  majEcran();
  const btn = document.getElementById('btn-assist');
  if(btn && panel) btn.addEventListener('click', () => { panel.classList.toggle('open'); majEcran(); });
  const btnDev = document.getElementById('btn-devis');
  if(btnDev && pdev) btnDev.addEventListener('click', () => { pdev.classList.toggle('open'); majEcran(); });
  const fermeDev = document.getElementById('btn-devis-fermer');
  if(fermeDev && pdev) fermeDev.addEventListener('click', () => { pdev.classList.remove('open'); majEcran(); });
  const btnRec = document.getElementById('btn-rec');
  if(btnRec) btnRec.addEventListener('click', basculerEnregistrement);
  majBoutonRec();
  renderAssist(); renderTranscript(); renderSujets(); renderDevis();

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const dot = document.getElementById('assist-rec');
  if(!SR){
    if(dot) dot.classList.add('off');
    const lbl = document.getElementById('assist-rec-lbl');
    if(lbl) lbl.textContent = 'Transcription non supportée';
    return;
  }
  wantRec = true;
  // On garde le micro ouvert comme en visio : Chrome ne le relache plus entre deux relances.
  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(st => { micStream = st; })
    .catch(() => {});
  recog = new SR();
  recog.lang = 'fr-FR';
  recog.continuous = true;
  recog.interimResults = true;
  recog.onstart = () => { recogActif = true; if(dot) dot.classList.remove('off'); };
  recog.onresult = (ev) => {
    let interim = '';
    for(let i = ev.resultIndex; i < ev.results.length; i++){
      const r = ev.results[i];
      if(r.isFinal) transcriptFinal += r[0].transcript.trim() + ' ';
      else interim += r[0].transcript;
    }
    transcriptInterim = interim;
    const kw = detecterKw(fenetre());
    if(kw !== null) kwDetecte = kw;
    renderTranscript();
    renderAssist();
  };
  recog.onerror = (e) => {
    // 'no-speech' et 'aborted' sont normaux : on laisse le chien de garde relancer.
    if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
      wantRec = false;
      if(dot) dot.classList.add('off');
      toast("Transcription refusée : micro non autorisé.");
    }
  };
  recog.onend = () => {
    recogActif = false;
    if(!wantRec){ if(dot) dot.classList.add('off'); return; }
    try{ recog.start(); }catch(e){}   // relance immediate, sans perdre de mots
  };
  try{ recog.start(); }catch(e){}
  // chien de garde : Chrome coupe la reconnaissance toutes les ~60 s, on la remet en route
  if(recogWatch) clearInterval(recogWatch);
  recogWatch = setInterval(() => {
    if(!wantRec || recogActif || !recog) return;
    try{ recog.start(); }catch(e){}
  }, 3000);
}

async function stopAssistant(){
  wantRec = false; recogActif = false;
  if(recogWatch){ clearInterval(recogWatch); recogWatch = null; }
  if(recog){ try{ recog.abort(); }catch(e){} recog = null; }
  if(micStream){ micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  const texte = (transcriptFinal || '').trim();
  if(!assistCallId || !texte){ assistCallId = null; return; }
  const payload = {
    source: 'console',
    auteur: (auth.currentUser && auth.currentUser.email) || '',
    callId: assistCallId,
    callerName: assistCallerName,
    transcript: texte,
    fichesDetectees: [...fichesVues],
    sujets: [...sujets],
    devis: devis.map(l => ({ designation: l.des, unite: l.unite, prixHT: l.pu, tva: l.tva, qte: l.qte })),
    totalHT: Math.round(devisTotaux().ht * 100) / 100,
    totalTTC: Math.round(devisTotaux().ttc * 100) / 100,
    kwDetecte: kwDetecte,
    videoFichier: nomFichierVideo || '',
    startedAtMs: assistStartedAt,
    endedAtMs: Date.now(),
    dureeSec: Math.round((Date.now() - assistStartedAt) / 1000),
    createdAt: serverTimestamp()
  };
  assistCallId = null;
  try{
    const ref = await addDoc(collection(db, "diagnostics"), payload);
    dernierDiagId = ref.id;
    toast("Transcription enregistrée.");
  }catch(e){
    toast("Transcription non enregistrée : " + (e.code || e.message));
  }
}

/* ---------- recapitulatif garde a l'ecran apres le raccrochage ---------- */
let dernierDiagId = null;
function ecranRecap(){
  if(!devis.length && !sujets.length){ callRoot.innerHTML = ''; return; }
  callRoot.innerHTML = `
    <div class="call-screen recap-screen">
      <div class="recap">
        <h2>Appel terminé</h2>
        <p class="recap-sub">Le devis reste modifiable. Enregistre-le quand il est bon, il part dans l'onglet Diagnostics.</p>
        <div class="sujets" id="sujets"></div>
        <div class="devis">
          <h4>Devis</h4>
          <div class="devis-corps" id="devis-lignes"></div>
          <div class="devis-sugg" id="devis-sugg"></div>
          <div class="devis-total" id="devis-total"></div>
        </div>
        <div class="recap-actions">
          <button class="btn small" id="btn-recap-save"><i class="fas fa-floppy-disk"></i> Enregistrer le devis</button>
          <button class="btn ghost small" id="btn-recap-close"><i class="fas fa-xmark"></i> Fermer</button>
        </div>
      </div>
    </div>`;
  renderSujets(); renderDevis();
  document.getElementById('btn-recap-save').addEventListener('click', enregistrerDevisRecap);
  document.getElementById('btn-recap-close').addEventListener('click', () => {
    callRoot.innerHTML = '';
    sujets = []; sujetsEcartes = new Set(); devisInit(); dernierDiagId = null;
  });
}
async function enregistrerDevisRecap(){
  const t = devisTotaux();
  const maj = {
    sujets: [...sujets],
    devis: devis.map(l => ({ designation: l.des, unite: l.unite, prixHT: l.pu, tva: l.tva, qte: l.qte })),
    totalHT: Math.round(t.ht * 100) / 100,
    totalTTC: Math.round(t.ttc * 100) / 100
  };
  try{
    if(dernierDiagId){
      await updateDoc(doc(db, "diagnostics", dernierDiagId), maj);
    }else{
      const ref = await addDoc(collection(db, "diagnostics"), {
        source: 'console',
        auteur: (auth.currentUser && auth.currentUser.email) || '',
        callerName: assistCallerName || 'Appel',
        transcript: (transcriptFinal || '').trim(),
        fichesDetectees: [...fichesVues],
        kwDetecte: kwDetecte,
        startedAtMs: assistStartedAt || Date.now(),
        endedAtMs: Date.now(),
        dureeSec: 0,
        createdAt: serverTimestamp(),
        ...maj
      });
      dernierDiagId = ref.id;
    }
    toast("Devis enregistré.");
  }catch(e){ toast("Devis non enregistré : " + (e.code || e.message)); }
}

/* ---------- ecran CATALOGUE ---------- */
function pctDe(m){
  if(m.margePct != null) return m.margePct;
  if(m.prixVenteTTC != null && m.prixCedeoTTC) return Math.round((m.prixVenteTTC / m.prixCedeoTTC - 1) * 1000) / 10;
  return null;
}

async function appliquerMargeGlobale(){
  const inp = document.getElementById('cat-bulk-pct');
  const pct = parseFloat(inp.value);
  if(isNaN(pct)){ toast("Saisis un pourcentage."); return; }
  const cibles = catalogue.filter(m => m.prixCedeoTTC);
  if(!cibles.length){ toast("Aucune référence avec un prix d'achat."); return; }
  if(!confirm(`Appliquer ${pct} % à ${cibles.length} référence(s) ? Les prix de vente déjà saisis seront écrasés.`)) return;
  const btn = document.getElementById('btn-cat-bulk');
  if(btn){ btn.disabled = true; btn.textContent = 'Application…'; }
  let ko = 0;
  for(const m of cibles){
    const prix = Math.round(m.prixCedeoTTC * (1 + pct/100) * 100) / 100;
    try{ await updateDoc(doc(db, "catalogue", m.id), { margePct: pct, prixVenteTTC: prix }); }
    catch(e){ ko++; }
  }
  if(btn){ btn.disabled = false; btn.textContent = 'Appliquer à tout'; }
  inp.value = '';
  toast(ko ? `${cibles.length - ko} mis à jour, ${ko} en échec.` : `${cibles.length} prix mis à jour.`);
}

async function purgerDiagnostics(){
  const limite = Date.now() - 30*24*3600*1000;
  const vieux = diags.filter(d => (d.endedAtMs || 0) < limite);
  if(!vieux.length){ toast("Aucune transcription de plus de 30 jours."); return; }
  if(!confirm(`Supprimer définitivement ${vieux.length} transcription(s) de plus de 30 jours ?`)) return;
  let ko = 0;
  for(const d of vieux){
    try{ await deleteDoc(doc(db, "diagnostics", d.id)); } catch(e){ ko++; }
  }
  toast(ko ? `${vieux.length - ko} supprimée(s), ${ko} en échec.` : `${vieux.length} transcription(s) supprimée(s).`);
}

function renderCatalogue(){
  const box = document.getElementById('cat-list');
  if(!box) return;
  if(!catalogue.length){
    box.innerHTML = `<p class="empty-txt">Catalogue vide. Clique sur « Importer les 13 chaudières Frisquet » pour partir des références CEDEO.</p>`;
    return;
  }
  box.innerHTML = catalogue.map(m => `
    <div class="cat-row" data-id="${m.id}">
      <div class="cat-main">
        <div class="cat-t">${m.gamme || ''} <span class="cat-kw">${m.kwMin === m.kwMax ? m.kwMin : m.kwMin + '-' + m.kwMax} kW</span></div>
        <div class="cat-v">${m.variante || ''}${m.refCedeo ? ' · réf. CEDEO ' + m.refCedeo : ''}</div>
      </div>
      <div class="cat-prix">
        <label>Achat CEDEO</label>
        <span class="cat-achat">${eur(m.prixCedeoTTC) || '—'}</span>
      </div>
      <div class="cat-prix cat-pct">
        <label>Marge %</label>
        <input type="number" step="0.1" value="${pctDe(m) != null ? pctDe(m) : ''}" placeholder="—" data-pct="${m.id}" ${m.prixCedeoTTC ? '' : 'disabled title="Pas de prix d\'achat : saisis le prix de vente directement"'}>
      </div>
      <div class="cat-prix">
        <label>Prix de vente TTC</label>
        <input type="number" step="0.01" min="0" value="${m.prixVenteTTC != null ? m.prixVenteTTC : ''}" placeholder="—" data-pv="${m.id}">
      </div>
      <button class="cat-del" data-del="${m.id}" title="Supprimer"><i class="fas fa-trash"></i></button>
    </div>`).join('');

  box.querySelectorAll('input[data-pv]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const v = inp.value === '' ? null : parseFloat(inp.value);
      const m = catalogue.find(x => x.id === inp.dataset.pv);
      // prix saisi a la main -> on recalcule le % correspondant
      const pct = (v != null && m && m.prixCedeoTTC)
        ? Math.round((v / m.prixCedeoTTC - 1) * 1000) / 10 : null;
      try{
        await updateDoc(doc(db, "catalogue", inp.dataset.pv), { prixVenteTTC: v, margePct: pct });
        inp.classList.add('ok'); setTimeout(() => inp.classList.remove('ok'), 900);
      }catch(e){ toast("Enregistrement refusé : " + (e.code || e.message)); }
    });
  });
  box.querySelectorAll('input[data-pct]').forEach(inp => {
    inp.addEventListener('change', async () => {
      const m = catalogue.find(x => x.id === inp.dataset.pct);
      if(!m || !m.prixCedeoTTC) return;
      if(inp.value === ''){
        try{ await updateDoc(doc(db, "catalogue", m.id), { margePct: null, prixVenteTTC: null }); }
        catch(e){ toast("Enregistrement refusé : " + (e.code || e.message)); }
        return;
      }
      const pct = parseFloat(inp.value);
      if(isNaN(pct)) return;
      const prix = Math.round(m.prixCedeoTTC * (1 + pct/100) * 100) / 100;
      try{
        await updateDoc(doc(db, "catalogue", m.id), { margePct: pct, prixVenteTTC: prix });
        inp.classList.add('ok'); setTimeout(() => inp.classList.remove('ok'), 900);
      }catch(e){ toast("Enregistrement refusé : " + (e.code || e.message)); }
    });
  });
  box.querySelectorAll('button[data-del]').forEach(b => {
    b.addEventListener('click', async () => {
      if(!confirm("Supprimer cette référence du catalogue ?")) return;
      try{ await deleteDoc(doc(db, "catalogue", b.dataset.del)); }
      catch(e){ toast("Suppression refusée : " + (e.code || e.message)); }
    });
  });
}

async function importerCatalogue(){
  const btn = document.getElementById('btn-cat-import');
  if(btn){ btn.disabled = true; btn.textContent = 'Import…'; }
  try{
    const existants = new Set(catalogue.map(x => x.refCedeo));
    let ajoutes = 0, ignores = 0;
    for(const m of CATALOGUE_SEED){
      if(existants.has(m.refCedeo)){ ignores++; continue; }
      await addDoc(collection(db, "catalogue"), {
        marque: 'Frisquet', actif: true, prixVenteTTC: null, ...m, createdAt: serverTimestamp()
      });
      ajoutes++;
    }
    toast(ignores ? `${ajoutes} ajouté(s), ${ignores} déjà présent(s).` : `${ajoutes} modèle(s) importé(s).`);
  }catch(e){ toast("Import refusé : " + (e.code || e.message)); }
  if(btn){ btn.disabled = false; btn.textContent = 'Importer les 13 chaudières Frisquet'; }
}

async function ajouterModele(){
  const g = document.getElementById('cat-new-gamme').value.trim();
  const v = document.getElementById('cat-new-var').value.trim();
  const kmin = parseInt(document.getElementById('cat-new-kwmin').value, 10);
  const kmax = parseInt(document.getElementById('cat-new-kwmax').value, 10) || kmin;
  const pv = document.getElementById('cat-new-prix').value;
  if(!g || isNaN(kmin)){ toast("Gamme et puissance minimum obligatoires."); return; }
  if(catalogue.some(x => (x.gamme||'').toLowerCase() === g.toLowerCase() && x.kwMin === kmin && x.kwMax === kmax)){
    toast("Ce modèle existe déjà dans le catalogue."); return;
  }
  try{
    await addDoc(collection(db, "catalogue"), {
      marque: 'Frisquet', gamme: g, variante: v, kwMin: kmin, kwMax: kmax,
      refCedeo: '', refFab: '', prixCedeoTTC: null,
      prixVenteTTC: pv === '' ? null : parseFloat(pv),
      actif: true, createdAt: serverTimestamp()
    });
    ['cat-new-gamme','cat-new-var','cat-new-kwmin','cat-new-kwmax','cat-new-prix'].forEach(id => document.getElementById(id).value = '');
  }catch(e){ toast("Ajout refusé : " + (e.code || e.message)); }
}

/* ---------- ecran DIAGNOSTICS ---------- */
let diagsUnsub = null, diags = [];

function ecouterDiagnostics(){
  if(diagsUnsub) return;
  const q = query(collection(db, "diagnostics"), orderBy("endedAtMs", "desc"), limit(40));
  diagsUnsub = onSnapshot(q, (snap) => {
    diags = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderDiagnostics();
  }, (e) => {
    const box = document.getElementById('diag-list');
    if(box) box.innerHTML = `<p class="empty-txt">Lecture impossible : ${e.code || e.message}</p>`;
  });
}

function esc(v){ return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function blocEstimation(d){
  const lignes = d.devis || [];
  if(!lignes.length) return '';
  const ht = lignes.reduce((s, l) => s + (l.prixHT || 0) * (l.qte || 1), 0);
  const tva = lignes.reduce((s, l) => s + (l.prixHT || 0) * (l.qte || 1) * ((l.tva == null ? 10 : l.tva) / 100), 0);
  return `<div class="diag-estim hidden" id="estim-${d.id}">
    <div class="de-titre">Estimation établie pendant l'appel</div>
    <table class="de-tab">
      <thead><tr><th>Désignation</th><th>Qté</th><th>PU HT</th><th>TVA</th><th>Montant HT</th></tr></thead>
      <tbody>${lignes.map(l => `<tr>
        <td>${esc(l.designation)}${l.unite ? `<span class="de-u">${esc(l.unite)}</span>` : ''}</td>
        <td class="c">${l.qte || 1}</td>
        <td class="r">${eur(l.prixHT)}</td>
        <td class="c">${l.tva == null ? 10 : l.tva} %</td>
        <td class="r">${eur((l.prixHT || 0) * (l.qte || 1))}</td></tr>`).join('')}</tbody>
    </table>
    <div class="de-tot">
      <div><span>Total HT</span><b>${eur(d.totalHT != null ? d.totalHT : ht)}</b></div>
      <div><span>TVA</span><b>${eur(tva)}</b></div>
      <div class="ttc"><span>Total TTC</span><b>${eur(d.totalTTC != null ? d.totalTTC : ht + tva)}</b></div>
    </div>
  </div>`;
}

function renderDiagnostics(){
  const box = document.getElementById('diag-list');
  if(!box) return;
  if(!diags.length){
    box.innerHTML = `<p class="empty-txt">Aucune transcription pour l'instant. Elles apparaîtront ici après chaque appel.</p>`;
    return;
  }
  box.innerHTML = diags.map(d => {
    const dt = d.endedAtMs ? new Date(d.endedAtMs) : null;
    const quand = dt ? dt.toLocaleString('fr-FR', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
    const mn = d.dureeSec ? Math.floor(d.dureeSec/60) + ' min ' + (d.dureeSec%60) + ' s' : '—';
    const tags = (d.fichesDetectees || []).map(id => {
      const f = fiches.find(x => x.id === id);
      return `<span class="tag">${f ? f.court : id}</span>`;
    }).join('');
    return `
      <div class="diag" style="display:flex;flex-direction:column">
        <div style="display:flex;align-items:center">
        <div class="diag-head" data-open="${d.id}" style="flex:1">
          <span class="diag-when">${quand}</span>
          <span class="diag-meta">${esc(d.client || d.callerName || 'Visiteur')} · ${mn}${d.kwDetecte ? ' · ' + d.kwDetecte + ' kW' : ''}${d.videoFichier ? ' · vidéo' : ''}</span>
          ${d.totalTTC ? `<span class="diag-ttc">${eur(d.totalTTC)} TTC</span>` : ''}
          <span class="diag-tags">${tags}</span>
          <i class="fas fa-chevron-down"></i>
        </div>
        <button class="diag-del" data-suppr="${d.id}" title="Supprimer"><i class="fas fa-trash"></i></button>
        </div>
        <div class="diag-body" id="diag-${d.id}">
          <div class="diag-edit">
            <label>Client / chantier</label>
            <input type="text" data-client="${d.id}" value="${esc(d.client || '')}" placeholder="Nom du client, adresse, référence du chantier">
            <label>Note sur cet appel</label>
            <textarea data-dnote="${d.id}" placeholder="Ce qui a été annoncé, le rendez-vous pris, le montant…">${esc(d.note || '')}</textarea>
            ${d.videoFichier ? `<p class="diag-video"><i class="fas fa-film"></i> ${esc(d.videoFichier)}</p>` : ''}
            <div class="diag-edit-actions">
              <button class="btn small" data-save="${d.id}"><i class="fas fa-floppy-disk"></i> Enregistrer</button>
              ${(d.devis || []).length ? `<button class="btn ghost small" data-estim="${d.id}"><i class="fas fa-file-invoice"></i> Voir l'estimation</button>` : ''}
              <button class="btn ghost small" data-copy="${d.id}"><i class="fas fa-copy"></i> Copier la transcription</button>
            </div>
          </div>
          ${blocEstimation(d)}
          <p>${(d.transcript || '').replace(/</g,'&lt;')}</p>
        </div>
      </div>`;
  }).join('');

  box.querySelectorAll('[data-open]').forEach(h => {
    h.addEventListener('click', () => {
      const b = document.getElementById('diag-' + h.dataset.open);
      if(b) b.classList.toggle('open');
      h.classList.toggle('open');
    });
  });
  box.querySelectorAll('[data-suppr]').forEach(b => {
    b.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if(!confirm("Supprimer définitivement cette transcription ?")) return;
      try{ await deleteDoc(doc(db, "diagnostics", b.dataset.suppr)); toast("Transcription supprimée."); }
      catch(e){ toast("Suppression refusée : " + (e.code || e.message)); }
    });
  });
  box.querySelectorAll('[data-estim]').forEach(b => {
    b.addEventListener('click', () => {
      const e = document.getElementById('estim-' + b.dataset.estim);
      if(!e) return;
      const ouvert = !e.classList.toggle('hidden');
      b.innerHTML = ouvert
        ? '<i class="fas fa-chevron-up"></i> Masquer l\'estimation'
        : '<i class="fas fa-file-invoice"></i> Voir l\'estimation';
    });
  });
  box.querySelectorAll('[data-save]').forEach(b => {
    b.addEventListener('click', async () => {
      const id = b.dataset.save;
      const ci = box.querySelector(`[data-client="${id}"]`);
      const ni = box.querySelector(`[data-dnote="${id}"]`);
      try{
        await updateDoc(doc(db, "diagnostics", id), {
          client: ci ? ci.value.trim() : '',
          note:   ni ? ni.value.trim() : '',
          modifieAtMs: Date.now()
        });
        toast("Appel attribué.");
      }catch(e){ toast("Enregistrement refusé : " + (e.code || e.message)); }
    });
  });
  box.querySelectorAll('[data-copy]').forEach(b => {
    b.addEventListener('click', async () => {
      const d = diags.find(x => x.id === b.dataset.copy);
      if(!d) return;
      try{ await navigator.clipboard.writeText(d.transcript || ''); toast("Transcription copiée."); }
      catch(e){ toast("Copie impossible."); }
    });
  });
}

/* ---------- onglets de la console ---------- */
function initOnglets(){
  const map = { 'tab-appels':'pan-appels', 'tab-catalogue':'pan-catalogue', 'tab-tarifs':'pan-tarifs', 'tab-fiches':'pan-fiches', 'tab-diagnostics':'pan-diagnostics' };
  Object.keys(map).forEach(t => {
    const btn = document.getElementById(t);
    if(!btn) return;
    btn.addEventListener('click', () => {
      Object.keys(map).forEach(k => {
        document.getElementById(k).classList.toggle('on', k === t);
        document.getElementById(map[k]).classList.toggle('hidden', k !== t);
      });
    });
  });
  const imp = document.getElementById('btn-cat-import');
  if(imp) imp.addEventListener('click', importerCatalogue);
  const add = document.getElementById('btn-cat-add');
  if(add) add.addEventListener('click', ajouterModele);
  const bulk = document.getElementById('btn-cat-bulk');
  if(bulk) bulk.addEventListener('click', appliquerMargeGlobale);
  const purge = document.getElementById('btn-diag-purge');
  if(purge) purge.addEventListener('click', purgerDiagnostics);
  const ra = document.getElementById('rec-auto');
  if(ra){
    ra.checked = recAuto;
    ra.addEventListener('change', () => {
      recAuto = ra.checked;
      localStorage.setItem('ds-rec-auto', recAuto ? '1' : '0');
      toast(recAuto ? "Enregistrement automatique activé." : "Enregistrement manuel : appuie sur « Enregistrer » pendant l'appel.");
    });
  }
  const fimp = document.getElementById('btn-fic-import');
  if(fimp) fimp.addEventListener('click', importerFiches);
  const fnew = document.getElementById('btn-fic-new');
  if(fnew) fnew.addEventListener('click', nouvelleFiche);
  const tsave = document.getElementById('btn-tar-save');
  if(tsave) tsave.addEventListener('click', enregistrerTarifs);
  const pxi = document.getElementById('btn-px-import');
  if(pxi) pxi.addEventListener('click', importerPrix);
  const pxa = document.getElementById('btn-px-add');
  if(pxa) pxa.addEventListener('click', ajouterPrix);
  const cos = document.getElementById('btn-co-save');
  if(cos) cos.addEventListener('click', enregistrerCoefs);
  const coa = document.getElementById('btn-co-apply');
  if(coa) coa.addEventListener('click', appliquerCoefsCatalogue);
  const fd = document.getElementById('btn-fic-dedup');
  if(fd) fd.addEventListener('click', () => dedoublonner('fiches', fichesBrutes, x => x.id || x.titre, 'les fiches'));
  const pd = document.getElementById('btn-px-dedup');
  if(pd) pd.addEventListener('click', () => dedoublonner('prix', prix, x => (x.famille||'') + '|' + (x.designation||''), 'les tarifs'));
  const ec = document.getElementById('btn-ecoute');
  if(ec) ec.addEventListener('click', ouvrirEcoute);
  const lp = document.getElementById('btn-lien-poste');
  if(lp) lp.addEventListener('click', async () => {
    const url = location.href.replace(/[^/]*$/, 'assistant.html');
    try{ await navigator.clipboard.writeText(url); toast("Lien copié : " + url); }
    catch(e){ toast(url); }
  });
  const cd = document.getElementById('btn-cat-dedup');
  if(cd) cd.addEventListener('click', () => dedoublonner('catalogue', catalogue, x => x.refCedeo || x.gamme, 'le catalogue'));
}

</script>
