<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="robots" content="noindex, nofollow">
<title>Assistant appel – DS Plomberie</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--blue:#0e6ba8;--blue-light:#1a8fd1;--orange:#e87722;--ink:#06243a;--ink2:#0b3350;--line:rgba(255,255,255,.14)}
body{font-family:'Red Hat Display',sans-serif;background:var(--ink);color:#fff;min-height:100dvh;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:22px 18px 40px}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.head h1{font-size:1.05rem;font-weight:900}
.head .sub{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;border:2px solid var(--orange);padding:13px 24px;border-radius:4px;font:700 .9rem/1 'Red Hat Display',sans-serif;cursor:pointer;transition:.2s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:var(--line);color:rgba(255,255,255,.85)}
.btn.small{padding:9px 16px;font-size:.78rem}
.card{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:20px}
.field{margin-bottom:13px}
.field label{display:block;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.55);margin-bottom:6px}
.field input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:6px;padding:12px 14px;color:#fff;font:400 .95rem 'Red Hat Display',sans-serif}
.field input:focus{outline:none;border-color:var(--blue-light)}
.err{color:#FF9C9C;font-size:.84rem;margin-top:10px;min-height:20px}
.hidden{display:none !important}

/* bouton micro */
.mic-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:26px 18px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.2);margin-bottom:18px;text-align:center}
.mic{width:110px;height:110px;border-radius:50%;border:2px solid rgba(232,119,34,.55);background:rgba(232,119,34,.12);color:#f0a05a;font-size:38px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.mic:active{transform:scale(.94)}
.mic.on{color:#FF6B6B;border-color:rgba(255,107,107,.75);background:rgba(255,107,107,.14);animation:micpulse 1.7s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}70%{box-shadow:0 0 0 22px rgba(255,107,107,0)}100%{box-shadow:0 0 0 0 rgba(255,107,107,0)}}
.mic-lbl{font-size:.94rem;font-weight:700}
.mic-hint{font-size:.78rem;color:rgba(255,255,255,.5);max-width:420px}

/* fiches */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:12px}
.tabs button{flex:0 0 auto;background:rgba(0,0,0,.3);border:1px solid var(--line);color:rgba(255,255,255,.75);border-radius:999px;padding:6px 12px;font:600 .73rem 'Red Hat Display',sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--orange);border-color:var(--orange);color:#fff}
.fiche{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.fiche h3{font-size:.94rem;font-weight:900;margin-bottom:10px}
.fiche .blk{margin-bottom:12px}
.fiche .blk b{display:block;font-size:.61rem;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin-bottom:5px}
.fiche .blk ul{margin:0;padding-left:17px}
.fiche .blk li{font-size:.81rem;color:rgba(255,255,255,.88);margin-bottom:4px}
.fiche .blk p{font-size:.81rem;color:rgba(255,255,255,.88)}
.fiche .flag{background:rgba(232,119,34,.14);border:1px solid rgba(232,119,34,.42);border-radius:6px;padding:8px 11px;font-size:.78rem;color:#ffd7ae}
.fiche .tarif{background:rgba(255,255,255,.07);border-radius:6px;padding:8px 11px;font-size:.78rem}
.empty-txt{color:rgba(255,255,255,.45);font-size:.85rem;padding:12px 0}
.pxl{margin-top:2px}
.pxr{display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.08);padding:7px 0;font-size:.83rem}
.pxr:first-child{border-top:none}
.pxr-d{color:rgba(255,255,255,.85);flex:1}
.pxr-p{color:#4CE28C;font-weight:700;white-space:nowrap}
.pxr-u{color:rgba(255,255,255,.35);font-weight:400;font-size:.72rem}
.mod{border-top:1px solid rgba(255,255,255,.1);padding:9px 0}
.mod:first-of-type{border-top:none}
.mod-t{font-size:.85rem;font-weight:700}
.mod-kw{color:var(--orange);font-size:.75rem}
.mod-v{font-size:.75rem;color:rgba(255,255,255,.5)}
.mod-p{font-size:.9rem;font-weight:900;color:#4CE28C;margin-top:4px}
.mod-p .sur-devis{color:rgba(255,255,255,.5);font-weight:400;font-style:italic;font-size:.82rem}

/* transcription + notes */
.tr{margin-top:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:.78rem;color:rgba(255,255,255,.7);max-height:120px;overflow-y:auto;line-height:1.55}
.tr .interim{color:rgba(255,255,255,.4);font-style:italic}
.notes{margin-top:18px}
.notes h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);margin-bottom:8px}
.notes textarea{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:8px;padding:13px 15px;color:#fff;font:400 .9rem 'Red Hat Display',sans-serif;line-height:1.6;resize:vertical;min-height:130px}
.notes textarea:focus{outline:none;border-color:var(--blue-light)}
.notes-bar{display:flex;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap}
.notes-bar .etat{font-size:.76rem;color:rgba(255,255,255,.45)}
.hist{margin-top:22px}
.hist h2{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,255,255,.5);margin-bottom:8px}
.hist-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.hist-head h2{margin:0}
.hitem{border:1px solid var(--line);border-radius:8px;margin-bottom:7px;background:rgba(0,0,0,.18);font-size:.84rem;overflow:hidden}
.hitem>summary{list-style:none;cursor:pointer;padding:11px 14px}
.hitem>summary::-webkit-details-marker{display:none}
.hitem[open]>summary{border-bottom:1px solid var(--line)}
.hitem .q{font-size:.72rem;color:rgba(255,255,255,.45);margin-bottom:3px;display:flex;gap:10px;flex-wrap:wrap}
.hitem .q .ttc{color:#4CE28C;font-weight:700}
.hitem .apercu{color:rgba(255,255,255,.85);line-height:1.5}
.hitem .detail{padding:12px 14px;display:grid;gap:12px}
.hitem .detail b{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--orange);margin-bottom:4px}
.hitem .detail p{white-space:pre-wrap;font-size:.83rem;color:rgba(255,255,255,.88);line-height:1.55;margin:0}
.hitem .detail .brut{font-size:.79rem;color:rgba(255,255,255,.6)}
.hitem .dvl{display:flex;justify-content:space-between;gap:10px;font-size:.79rem;padding:4px 0;border-top:1px solid rgba(255,255,255,.07)}
.hitem .dvl:first-of-type{border-top:none}
.hitem .acts{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:900;background:#06243a;color:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 18px;font-size:.85rem;max-width:88vw;text-align:center}

/* ===== sujets cumulés + devis ===== */
.sujets{display:flex;flex-wrap:wrap;gap:6px;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--ink2);margin-bottom:12px}
.sujets-vide{font-size:.72rem;color:rgba(255,255,255,.35)}
.suj{display:inline-flex;align-items:center;gap:5px;background:rgba(232,119,34,.16);border:1px solid rgba(232,119,34,.45);color:#ffc793;border-radius:999px;padding:3px 5px 3px 10px;font-size:.72rem;cursor:pointer}
.suj.on{background:var(--orange);border-color:var(--orange);color:#fff}
.suj button{background:none;border:none;color:inherit;cursor:pointer;font-size:.95rem;line-height:1;padding:0 3px}
.devis{display:flex;flex-direction:column;min-height:0;background:var(--ink2);border:1px solid var(--line);border-radius:10px;position:sticky;top:14px}
.devis h4{font-size:.64rem;text-transform:uppercase;letter-spacing:.11em;color:rgba(255,255,255,.45);padding:13px 15px 9px;margin:0}
.devis-corps{flex:1 1 auto;overflow-y:auto;padding:0 15px;max-height:300px}
.dl{display:grid;grid-template-columns:1fr auto auto auto auto auto;align-items:center;gap:7px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:.76rem}
.dl:first-child{border-top:none}
.dl-d{min-width:0;line-height:1.3}
.dl-u{color:rgba(255,255,255,.3);font-size:.64rem;margin-left:5px}
.dl-q{display:flex;align-items:center;gap:4px}
.dl-q button{width:18px;height:18px;border-radius:4px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;cursor:pointer;font-size:.72rem;line-height:1;padding:0}
.dl-q span{min-width:14px;text-align:center}
.dl-pu{color:rgba(255,255,255,.5);white-space:nowrap;font-size:.7rem}
.dl-tva{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:4px;color:rgba(255,255,255,.7);font-size:.66rem;padding:2px 3px}
.dl-m{font-weight:700;white-space:nowrap}
.dl-x{background:none;border:none;color:rgba(255,255,255,.28);cursor:pointer;padding:2px}
.dl-x:hover{color:#FF6B6B}
.devis-sugg{display:flex;flex-wrap:wrap;gap:5px;padding:10px 14px;border-top:1px solid var(--line)}
.sg{background:rgba(0,0,0,.3);border:1px solid var(--line);color:rgba(255,255,255,.8);border-radius:6px;padding:5px 9px;font:400 .71rem 'Red Hat Display',sans-serif;cursor:pointer;text-align:left}
.sg:hover{border-color:var(--orange);color:#fff}
.sg i{color:var(--orange);font-size:.62rem;margin-right:3px}
.sg em{color:#4CE28C;font-style:normal;font-weight:700;margin-left:5px}
.devis-total{border-top:1px solid var(--line);padding:10px 14px;display:grid;gap:4px;font-size:.78rem}
.devis-total div{display:flex;justify-content:space-between}
.devis-total span{color:rgba(255,255,255,.5)}
.devis-total .ttc{font-size:.95rem;padding-top:5px;border-top:1px solid rgba(255,255,255,.1)}
.devis-total .ttc b{color:#4CE28C}

/* deux colonnes : fiche a gauche, devis a droite */
.duo{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){ .duo{grid-template-columns:1fr 300px; align-items:start} }
</style>
</head>
<body>
<div class="wrap">

  <section id="view-login">
    <div class="head"><div><h1>Assistant appel</h1><span class="sub">DS Plomberie</span></div></div>
    <div class="card">
      <div class="field"><label for="email">Email</label><input type="email" id="email" autocomplete="username"></div>
      <div class="field"><label for="password">Mot de passe</label><input type="password" id="password" autocomplete="current-password"></div>
      <button class="btn" id="btn-login" style="width:100%"><i class="fas fa-right-to-bracket"></i> Se connecter</button>
      <p class="err" id="login-err"></p>
    </div>
  </section>

  <section id="view-main" class="hidden">
    <div class="head">
      <div><h1>Assistant appel</h1><span class="sub" id="who">—</span></div>
      <button class="btn ghost small" id="btn-logout"><i class="fas fa-power-off"></i></button>
    </div>

    <div class="mic-box">
      <button class="mic" id="btn-mic" aria-label="Activer le micro"><i class="fas fa-microphone" id="mic-ico"></i></button>
      <div class="mic-lbl" id="mic-lbl">Appuie pour écouter l'appel</div>
      <div class="mic-hint" id="mic-hint">Au téléphone, mets le haut-parleur : le micro doit entendre le client. Sur ordinateur, ce n'est pas nécessaire si le son sort des enceintes.</div>
      <button class="btn ghost small" id="btn-reset"><i class="fas fa-rotate-left"></i> Réinitialiser pour l'appel suivant</button>
    </div>

    <div class="sujets" id="sujets"></div>
    <div class="duo">
      <div>
        <div class="tabs" id="tabs"></div>
        <div id="body"></div>
        <div class="tr" id="tr"></div>
      </div>
      <div class="devis">
        <h4>Devis en préparation</h4>
        <div class="devis-corps" id="devis-lignes"></div>
        <div class="devis-sugg" id="devis-sugg"></div>
        <div class="devis-total" id="devis-total"></div>
      </div>
    </div>

    <div class="notes">
      <h2>Mes notes</h2>
      <textarea id="note" placeholder="Nom du client, adresse, ce qu'il décrit, ce que tu lui as annoncé…"></textarea>
      <div class="notes-bar">
        <button class="btn small" id="btn-note"><i class="fas fa-floppy-disk"></i> Enregistrer la note</button>
        <span class="etat" id="note-etat"></span>
      </div>
    </div>

    <div class="hist">
      <div class="hist-head">
        <h2>Mes notes enregistrées</h2>
        <span class="etat" id="hist-nb"></span>
      </div>
      <div id="hist-list"><p class="empty-txt">Chargement…</p></div>
    </div>
  </section>
</div>

const strip = (t) => (t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
  .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
const eur = (n) => (n===null||n===undefined||n===''||isNaN(n)) ? null
  : Number(n).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €';

function tarifTexte(){

const CHIFFRES = {'dix':10,'douze':12,'quatorze':14,'quinze':15,'seize':16,'dix-huit':18,'dix huit':18,'vingt':20,'vingt-trois':23,'vingt trois':23,'vingt-cinq':25,'vingt cinq':25,'trente':30,'trente-deux':32,'trente deux':32,'quarante-cinq':45,'quarante cinq':45};
function detecterKw(txt){
  const t = strip(txt);
  let m = t.match(/(\d{1,3})\s*(kw|kilowatt|kilo watt|kilowatts)/);
  if(m) return parseInt(m[1],10);
  for(const mot in CHIFFRES){
    if(new RegExp(mot.replace(/-/g,'[ -]') + '\\s*(kw|kilowatt)').test(t)) return CHIFFRES[mot];
  }
  return null;
}

function fenetre(){
  const mots=(transcriptFinal+' '+transcriptInterim).trim().split(/\s+/);
  return mots.slice(-FENETRE_MOTS).join(' ');
}
function scoreFiches(txt){
  const t = strip(txt);
  return fiches.map(f => {
    const vus = new Set();
    let n = 0, dernier = -1;
    (f.mots || []).forEach(m => {
      const k = strip(m);
      if(!k || vus.has(k)) return;
      vus.add(k);
      const p = t.lastIndexOf(k);        // position du DERNIER emploi du mot-cle
      if(p >= 0){ n++; if(p > dernier) dernier = p; }
    });
    return { f, n, dernier };
  }).filter(x => x.n > 0)
    // la fiche dont un mot-cle vient d'etre prononce passe devant ;
    // le nombre de correspondances ne sert qu'a departager
    .sort((a, b) => (b.dernier - a.dernier) || (b.n - a.n));
}
// une seule fiche par identifiant, meme si la base en contient plusieurs
function uniques(liste){
  const vus=new Set(), out=[];
  liste.forEach(f=>{
    const k=(f.id||f.titre||'').toLowerCase();
    if(!k||vus.has(k)) return;
    vus.add(k);
    const m=[], vm=new Set();
    (f.mots||[]).forEach(x=>{ const s=strip(x); if(s&&!vm.has(s)){ vm.add(s); m.push(x); } });
    out.push({...f, mots:m});
  });
  return out;
}
function prixFamille(fam){
  return prix.filter(p=>p.famille===fam && p.actif!==false).sort((a,b)=>(a.prixHT||0)-(b.prixHT||0));
}
function blocPrixFamille(fam){
  const l=prixFamille(fam); if(!l.length) return '';
  const nom=(FAMILLES.find(f=>f.id===fam)||{}).nom||fam;
  return `<div class="blk"><b>Tarifs — ${nom}</b><div class="pxl">` +

}
function blocCatalogue(){
  if(kwDetecte===null) return `<div class="blk"><b>Modèles</b><p class="empty-txt">Dis une puissance (« 25 kW ») pour voir les modèles.</p></div>`;

}

function devisAjouter(designation, unite, pu, tva){
  const i = devis.findIndex(l => l.des === designation);

  else devis.push({ des: designation, unite: unite || 'U', pu: Number(pu) || 0, tva: tva == null ? TVA_DEFAUT : tva, qte: 1 });

}

  }));
  return out;
}

function renderSujets(){
  const box = document.getElementById('sujets');
  if(!box) return;
  if(!sujets.length){
    box.innerHTML = '<span class="sujets-vide">Aucun sujet détecté pour l\'instant</span>';
    return;
  }
  box.innerHTML = sujets.map(id => {
    const f = fiches.find(x => x.id === id);
    const nom = f ? f.court : id;
    const on = (ficheManuelle && ficheManuelle.id === id) ? ' on' : '';
    return `<span class="suj${on}" data-suj="${id}">${nom}<button data-rmsuj="${id}" title="Retirer">&times;</button></span>`;
  }).join('');
  box.querySelectorAll('[data-suj]').forEach(e => e.addEventListener('click', (ev) => {
    if(ev.target.dataset.rmsuj) return;
    ficheManuelle = fiches.find(f => f.id === e.dataset.suj) || null;
    renderAssist(); renderSujets();
  }));
  box.querySelectorAll('[data-rmsuj]').forEach(b => b.addEventListener('click', (ev) => {
    ev.stopPropagation(); retirerSujet(b.dataset.rmsuj);
  }));
}

function renderDevis(){
  const box = document.getElementById('devis-lignes');
  if(!box) return;
  box.innerHTML = devis.map((l, i) => `
    <div class="dl">
      <div class="dl-d">${l.des}<span class="dl-u">${l.unite}</span></div>
      <div class="dl-q">
        <button data-moins="${i}">−</button><span>${l.qte}</span><button data-plus="${i}">+</button>
      </div>
      <div class="dl-pu">${eur(l.pu)}</div>
      <select class="dl-tva" data-tva="${i}">
        <option value="10"${l.tva === 10 ? ' selected' : ''}>10 %</option>
        <option value="20"${l.tva === 20 ? ' selected' : ''}>20 %</option>
        <option value="0"${l.tva === 0 ? ' selected' : ''}>0 %</option>
      </select>
      <div class="dl-m">${eur(l.pu * l.qte)}</div>
      <button class="dl-x" data-rm="${i}" title="Retirer"><i class="fas fa-xmark"></i></button>
    </div>`).join('');

  box.querySelectorAll('[data-plus]').forEach(b => b.addEventListener('click', () => { devis[+b.dataset.plus].qte++; renderDevis(); }));
  box.querySelectorAll('[data-moins]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.moins;
    if(devis[i].qte > 1) devis[i].qte--; else devis.splice(i, 1);
    renderDevis();
  }));
  box.querySelectorAll('[data-rm]').forEach(b => b.addEventListener('click', () => { devis.splice(+b.dataset.rm, 1); renderDevis(); }));
  box.querySelectorAll('[data-tva]').forEach(s => s.addEventListener('change', () => { devis[+s.dataset.tva].tva = parseInt(s.value, 10); renderDevis(); }));

  const t = devisTotaux();
  const tot = document.getElementById('devis-total');
  if(tot) tot.innerHTML =
    `<div><span>Total HT</span><b>${eur(t.ht)}</b></div>` +
    `<div><span>TVA</span><b>${eur(t.tva)}</b></div>` +
    `<div class="ttc"><span>Total TTC</span><b>${eur(t.ttc)}</b></div>`;

  const sug = document.getElementById('devis-sugg');
  if(sug){
    const l = devisSuggestions();
    sug.innerHTML = l.length
      ? l.map(p => `<button class="sg" data-add='${encodeURIComponent(JSON.stringify({d:p.designation,u:p.unite,p:p.prixHT,t:p.tva}))}'>
           <i class="fas fa-plus"></i> ${p.designation} <em>${eur(p.prixHT)}</em></button>`).join('')
      : '<span class="sujets-vide">Les prestations proposées apparaîtront ici selon les sujets détectés.</span>';
    sug.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => {
      const o = JSON.parse(decodeURIComponent(b.dataset.add));
      devisAjouter(o.d, o.u, o.p, o.t);
    }));
  }
}

function renderAssist(){ render(); }

function render(){
  const ranked=scoreFiches(fenetre());
  const auto=ranked.length?ranked[0].f:null;
  if(auto) ajouterSujet(auto.id);
  const active=ficheManuelle||auto;
  $('tabs').innerHTML = [`<button class="${ficheManuelle?'':'on'}" data-f="__auto">Auto</button>`]
    .concat(fiches.map(f=>{
      const on=(ficheManuelle&&f.id===ficheManuelle.id)?' on':'';
      const hit=ranked.find(r=>r.f.id===f.id);
      return `<button class="${on.trim()}" data-f="${f.id}">${hit?'• ':''}${f.court}</button>`;
    })).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{
    ficheManuelle = b.dataset.f==='__auto' ? null : fiches.find(f=>f.id===b.dataset.f);
    render();
  }));
  $('body').innerHTML = active ? ficheHtml(active)
    : `<div class="fiche"><p class="empty-txt">Aucun cas détecté. Lance le micro, ou choisis une fiche ci-dessus.</p></div>`;
}
function renderTr(){
  $('tr').innerHTML = (transcriptFinal||'') + (transcriptInterim?`<span class="interim"> ${transcriptInterim}</span>`:'');
  $('tr').scrollTop = $('tr').scrollHeight;
}

/* ---------- micro ---------- */
function majMic(){
  const b=$('btn-mic'), i=$('mic-ico'), l=$('mic-lbl');
  b.classList.toggle('on', ecoute);
  i.className = ecoute ? 'fas fa-stop' : 'fas fa-microphone';
  l.textContent = ecoute ? "J'écoute — appuie pour arrêter" : "Appuie pour écouter l'appel";
}
function demarrerEcoute(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Ce navigateur ne gère pas la transcription. Utilise Chrome."); return; }
  transcriptFinal=''; transcriptInterim=''; kwDetecte=null; ficheManuelle=null; debutMs=Date.now();
  sujets=[]; devisInit();
  renderTr(); render(); renderSujets(); renderDevis();
  wantRec=true; ecoute=true; majMic();
  // micro maintenu ouvert : la reconnaissance peut se relancer sans coupure audible
  navigator.mediaDevices.getUserMedia({ audio:true }).then(st=>{ micStream=st; }).catch(()=>{});
  recog = new SR();
  recog.lang='fr-FR'; recog.continuous=true; recog.interimResults=true;
  recog.onstart=()=>{ recogActif=true; };
  recog.onresult=(ev)=>{
    let it='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const r=ev.results[i];
      if(r.isFinal) transcriptFinal += r[0].transcript.trim()+' '; else it += r[0].transcript;
    }
    transcriptInterim=it;
    const kw=detecterKw(fenetre()); if(kw!==null) kwDetecte=kw;
    renderTr(); render();
  };
  recog.onerror=(e)=>{
    // 'no-speech' et 'aborted' sont normaux, on ne coupe pas l'ecoute
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      wantRec=false; ecoute=false; majMic();
      toast("Micro refusé. Autorise le micro pour ce site.");
    }
  };
  recog.onend=()=>{
    recogActif=false;
    if(!wantRec){ ecoute=false; majMic(); return; }
    try{ recog.start(); }catch(e){}
  };
  try{ recog.start(); }catch(e){}
  if(recogWatch) clearInterval(recogWatch);
  recogWatch = setInterval(()=>{
    if(!wantRec || recogActif || !recog) return;
    try{ recog.start(); }catch(e){}
  }, 3000);
}
function arreterEcoute(){
  wantRec=false; ecoute=false; recogActif=false;
  if(recogWatch){ clearInterval(recogWatch); recogWatch=null; }
  if(recog){ try{ recog.abort(); }catch(e){} recog=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  majMic();
  if((transcriptFinal||'').trim()) enregistrer(false);
}
$('btn-mic').addEventListener('click',()=>{ ecoute ? arreterEcoute() : demarrerEcoute(); });

/* ---------- enregistrement ---------- */
async function enregistrer(manuel){
  const note=$('note').value.trim();
  const texte=(transcriptFinal||'').trim();
  if(!note && !texte){ if(manuel) toast("Rien à enregistrer."); return; }
  const ranked=scoreFiches(texte);
  try{
    await addDoc(collection(db,"diagnostics"),{
      source:'poste', auteur:monEmail, callerName:'Appel téléphone',
      transcript:texte, note:note,
      fichesDetectees: ranked.slice(0,3).map(r=>r.f.id),
      sujets:[...sujets],
      devis: devis.map(l=>({designation:l.des, unite:l.unite, prixHT:l.pu, tva:l.tva, qte:l.qte})),
      totalHT: Math.round(devisTotaux().ht*100)/100,
      totalTTC: Math.round(devisTotaux().ttc*100)/100,
      kwDetecte:kwDetecte,
      startedAtMs: debutMs || Date.now(),
      endedAtMs: Date.now(),
      dureeSec: debutMs ? Math.round((Date.now()-debutMs)/1000) : 0,
      createdAt: serverTimestamp()
    });
    $('note-etat').textContent = 'Enregistré à ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    if(manuel){ toast("Note enregistrée."); $('note').value=''; }
  }catch(e){ toast("Enregistrement refusé : " + (e.code||e.message)); }
}
$('btn-note').addEventListener('click',()=>enregistrer(true));

/* ---------- remise a zero entre deux appels ---------- */
function reinitialiser(){
  const note=$('note').value.trim();
  if((note || (transcriptFinal||'').trim()) &&
     !confirm("Tout effacer pour l'appel suivant ? La transcription et les notes non enregistrées seront perdues.")) return;
  if(ecoute) arreterEcouteSansSauver();
  transcriptFinal=''; transcriptInterim=''; kwDetecte=null; ficheManuelle=null; debutMs=null;
  sujets=[]; devisInit();
  $('note').value=''; $('note-etat').textContent='';
  renderTr(); render(); renderSujets(); renderDevis();
  toast("Prêt pour l'appel suivant.");
}
function arreterEcouteSansSauver(){
  wantRec=false; ecoute=false; recogActif=false;
  if(recogWatch){ clearInterval(recogWatch); recogWatch=null; }
  if(recog){ try{ recog.abort(); }catch(e){} recog=null; }
  if(micStream){ micStream.getTracks().forEach(t=>t.stop()); micStream=null; }
  majMic();
}
$('btn-reset').addEventListener('click', reinitialiser);

/* ---------- mes notes enregistrees ---------- */
let histo=[];
function esc(v){ return String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function dateFr(ms){
  if(!ms) return '—';
  return new Date(ms).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function texteNote(d){
  const l=[];
  l.push('Note du '+dateFr(d.endedAtMs));
  if(d.note) l.push('', d.note);
  if((d.devis||[]).length){
    l.push('', 'Devis :');
    d.devis.forEach(x=>l.push('- '+x.designation+'  x'+(x.qte||1)+'  '+eur(x.prixHT*(x.qte||1))+' HT'));
    l.push('Total TTC : '+eur(d.totalTTC||0));
  }
  if(d.transcript) l.push('', 'Transcription :', d.transcript);
  return l.join('\n');
}
function renderHisto(){
  const box=$('hist-list');
  $('hist-nb').textContent = histo.length ? histo.length+' enregistrée'+(histo.length>1?'s':'') : '';
  if(!histo.length){ box.innerHTML='<p class="empty-txt">Aucune note enregistrée pour l\'instant.</p>'; return; }
  box.innerHTML = histo.map((d,i)=>{
    const titres=(d.sujets||[]).map(id=>{ const f=fiches.find(x=>x.id===id); return f?f.titre:id; }).filter(Boolean);
    const duree=d.dureeSec?Math.round(d.dureeSec/60)+' min':'';
    const apercu=(d.note||d.transcript||'').slice(0,150);
    const lignes=(d.devis||[]).map(x=>`<div class="dvl"><span>${esc(x.designation)} <span style="opacity:.5">x${x.qte||1}</span></span><span>${eur((x.prixHT||0)*(x.qte||1))} HT</span></div>`).join('');
    return `<details class="hitem" data-i="${i}">
      <summary>
        <div class="q"><span>${dateFr(d.endedAtMs)}</span>${duree?`<span>${duree}</span>`:''}${titres.length?`<span>${esc(titres.join(' · '))}</span>`:''}${d.totalTTC?`<span class="ttc">${eur(d.totalTTC)} TTC</span>`:''}</div>
        <div class="apercu">${esc(apercu)}${(d.note||d.transcript||'').length>150?'…':''}</div>
      </summary>
      <div class="detail">
        ${d.note?`<div><b>Ma note</b><p>${esc(d.note)}</p></div>`:''}
        ${lignes?`<div><b>Devis préparé</b>${lignes}<div class="dvl"><span>Total TTC</span><span style="color:#4CE28C;font-weight:700">${eur(d.totalTTC||0)}</span></div></div>`:''}
        ${d.transcript?`<div><b>Transcription</b><p class="brut">${esc(d.transcript)}</p></div>`:''}
        <div class="acts">
          <button class="btn ghost small" data-copie="${i}"><i class="fas fa-copy"></i> Copier</button>
          <button class="btn ghost small" data-reprendre="${i}"><i class="fas fa-rotate-left"></i> Reprendre dans la note</button>
        </div>
      </div>
    </details>`;
  }).join('');
}
$('hist-list').addEventListener('click',(e)=>{
  const c=e.target.closest('[data-copie]');
  if(c){ const d=histo[+c.dataset.copie]; if(d){ navigator.clipboard.writeText(texteNote(d)).then(()=>toast("Note copiée."),()=>toast("Copie impossible.")); } return; }
  const r=e.target.closest('[data-reprendre]');
  if(r){
    const d=histo[+r.dataset.reprendre];
    if(!d) return;
    const actuel=$('note').value.trim();
    if(actuel && !confirm("Remplacer la note en cours par celle-ci ?")) return;
    $('note').value = d.note || '';
    $('note').focus();
    toast("Note rechargée.");
  }
});

/* ---------- login ---------- */
$('btn-login').addEventListener('click', async ()=>{
  $('login-err').textContent='';
  const e=$('email').value.trim(), p=$('password').value;
  if(!e||!p){ $('login-err').textContent="Email et mot de passe requis."; return; }
  try{ await signInWithEmailAndPassword(auth,e,p); }
  catch(err){ $('login-err').textContent="Connexion refusée — vérifie tes identifiants."; }
});
$('password').addEventListener('keydown',(e)=>{ if(e.key==='Enter') $('btn-login').click(); });
$('btn-logout').addEventListener('click',()=>{ arreterEcoute(); signOut(auth); });

onAuthStateChanged(auth,(user)=>{
  if(user && user.isAnonymous){ signOut(auth); return; }
  if(user){
    monEmail = user.email || '';
    $('view-login').classList.add('hidden');
    $('view-main').classList.remove('hidden');
    $('who').textContent = monEmail;
    $('password').value='';
    ecouterTout();
    devisInit(); render(); renderSujets(); renderDevis(); majMic();
  } else {
    $('view-main').classList.add('hidden');
    $('view-login').classList.remove('hidden');
  }
});

/* ---------- lectures Firestore ---------- */
let lance=false;
function ecouterTout(){
  if(lance) return; lance=true;
  onSnapshot(collection(db,"fiches"),(s)=>{
    const d=s.docs.map(x=>({docId:x.id,...x.data()})).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
    fiches = uniques(d.length ? d.map(x=>({...x,id:x.id||x.docId})) : FICHES_DEFAUT.slice());
    render();
  },()=>{});
  onSnapshot(collection(db,"prix"),(s)=>{ prix=s.docs.map(x=>({id:x.id,...x.data()})); render(); },()=>{});
  onSnapshot(collection(db,"catalogue"),(s)=>{ catalogue=s.docs.map(x=>({id:x.id,...x.data()})); render(); },()=>{});
  onSnapshot(doc(db,"reglages","tarifs"),(s)=>{
    const d=s.data(); if(d){ ['deplacement','premiereHeure','heureSuivante'].forEach(k=>{ if(d[k]!=null) tarifs[k]=d[k]; }); }
    render();
  },()=>{});
  onSnapshot(query(collection(db,"diagnostics"),where("auteur","==",monEmail)),(s)=>{
    histo = s.docs.map(x=>({docId:x.id,...x.data()}))
             .sort((a,b)=>(b.endedAtMs||0)-(a.endedAtMs||0))
             .slice(0,50);
    renderHisto();
  },(e)=>{
    $('hist-list').innerHTML='<p class="empty-txt">Notes indisponibles : '+esc(e.code||e.message)+'</p>';
  });
}
</script>
